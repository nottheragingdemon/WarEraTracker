<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WarEra Tracker</title>
<style>
:root{--bg:#fcfcfb;--panel:#ffffff;--ink:#0b0b0b;--ink2:#52514e;--line:#e4e3df;--s1:#2a78d6;--s2:#eb6834;--good:#0e7a4f;--bad:#c23b3a}
@media (prefers-color-scheme:dark){:root{--bg:#1a1a19;--panel:#222221;--ink:#f0efec;--ink2:#c3c2b7;--line:#383835;--s1:#3987e5;--s2:#d95926;--good:#3ec28b;--bad:#e66767}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 2px}
.sub{color:var(--ink2);font-size:12px;margin-bottom:12px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:8px}
.filters label{display:flex;flex-direction:column;font-size:11px;color:var(--ink2);gap:3px;min-width:0}
.filters select,.filters input{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 8px;min-width:0;width:100%}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;align-items:center;font-size:11px;color:var(--ink2)}
.hint{font-size:11px;color:var(--bad);min-height:14px;margin-bottom:4px}
button.chip{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:3px 10px;border-radius:14px;cursor:pointer}
button.chip[aria-pressed=true]{background:var(--s1);border-color:var(--s1);color:#fff}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{font:inherit;background:none;border:0;color:var(--ink2);padding:8px 12px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--s1);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;color:var(--ink2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:14px}
.card h2{font-size:13px;margin:0 0 8px;color:var(--ink2);font-weight:600}
.chart{display:flex;align-items:flex-end;gap:3px;height:120px}
.chart .col{flex:1;min-width:2px;background:var(--s1);border-radius:3px 3px 0 0}
.chart .col:hover{opacity:.8}
.axis{display:flex;justify-content:space-between;font-size:10px;color:var(--ink2);margin-top:4px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{font-size:11px;color:var(--ink2);font-weight:600}
td.n,th.n{text-align:right}
th.sel,td.sel{background:color-mix(in srgb,var(--s1) 8%,transparent)}
.tw{overflow-x:auto}
.bar{height:6px;background:var(--s1);border-radius:3px;min-width:1px;margin-top:3px}
.seg{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.pos{color:var(--good)}
.note{font-size:12px;color:var(--ink2);margin:6px 0}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:4px 8px;border-radius:5px;font-size:12px;display:none;z-index:9;max-width:220px}
</style>
</head>
<body>
<div class="wrap">
  <h1>WarEra Tracker</h1>
  <div class="sub" id="meta">Loading…</div>
  <div class="filters">
    <label>From<input type="date" id="f-from"></label>
    <label>To<input type="date" id="f-to"></label>
    <label>Alliance<select id="f-alliance"><option value="">All</option></select></label>
    <label>Country<select id="f-country"><option value="">All</option></select></label>
    <label>Military unit<input id="f-mu" list="dl-mu" placeholder="all (or type a name)" autocomplete="off"><datalist id="dl-mu"></datalist></label>
    <label>Player<input id="f-user" list="dl-user" placeholder="all (or type a name)" autocomplete="off"><datalist id="dl-user"></datalist></label>
  </div>
  <div class="presets" id="presets"></div>
  <div class="hint" id="hint"></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="view"></div>
</div>
<div id="tip"></div>
<script>
(function(){
"use strict";
var D=null,st={tab:"damage",by:"auto",sort:"date",from:"",to:"",alliance:-1,country:-1,mu:-1,user:-1,limit:50,bview:"country",cscope:"any"};
var $=function(i){return document.getElementById(i)};
function el(tag,attrs,kids){var e=document.createElement(tag);if(attrs)for(var k in attrs){if(k==="text")e.textContent=attrs[k];else if(k==="class")e.className=attrs[k];else e.setAttribute(k,attrs[k])}(kids||[]).forEach(function(c){if(c!=null)e.appendChild(typeof c==="string"?document.createTextNode(c):c)});return e}
var fmt=function(n){if(n==null)return"–";var a=Math.abs(n);if(a>=1e9)return(n/1e9).toFixed(2)+"B";if(a>=1e6)return(n/1e6).toFixed(2)+"M";if(a>=1e4)return(n/1e3).toFixed(1)+"k";return Number(n).toLocaleString(undefined,{maximumFractionDigits:2})};
var fmtD=function(s){return s?s.slice(0,16).replace("T"," "):"–"};
var TYPE={user:"Player",mu:"MU",country:"Country",alliance:"Alliance"};
function nm(i){if(i<0||i==null)return"–";var e=D.ents[i];return e[2]||(e[0]==="country"?e[1].slice(-6):TYPE[e[0]]+" …"+e[1].slice(-6))}
function tip(e,t){var x=$("tip");x.textContent=t;x.style.display="block";x.style.left=Math.min(e.clientX+12,innerWidth-230)+"px";x.style.top=(e.clientY+12)+"px"}
function untip(){$("tip").style.display="none"}
var tname=function(t){return TYPE[t]||t};
function region(b){return b[10]>=0?(D.ents[b[10]][2]||"…"+D.ents[b[10]][1].slice(-6)):"–"}

/* ---------- indexes ---------- */
var AB={},ST=[{},{}],boe={},relMu={},relUser={},entsOf={country:[],mu:[],user:[],alliance:[]},totDmg={};
function build(){
  ST=[{},{}];boe={};
  D.ents.forEach(function(e,i){if(entsOf[e[0]])entsOf[e[0]].push(i)});
  D.stats.forEach(function(r){var k=r[0],b=r[1],e=r[2],s=r[3];var m=ST[k][b]=ST[k][b]||{};var a=m[e]=m[e]||[0,0,0];a[s]+=r[4];(boe[e]=boe[e]||new Set()).add(b);if(k===0)totDmg[e]=(totDmg[e]||0)+r[4]});
  D.orders.forEach(function(o){(boe[o[2]]=boe[o[2]]||new Set()).add(o[0])});
  D.battles.forEach(function(b,i){[b[4],b[5]].forEach(function(e){if(e>=0)(boe[e]=boe[e]||new Set()).add(i)})});
  var al=D.alliances||{};AB={};
  Object.keys(al).forEach(function(a){var m=new Set(al[a]),set=AB[a]=new Set();D.battles.forEach(function(b,i){if(m.has(b[4])||m.has(b[5]))set.add(i)})});
  relMu=D.relMu||{};relUser=D.relUser||{};
}
function val(kind,b,e){var m=ST[kind][b];var a=m&&m[e];if(!a)return null;var t=(a[0]||a[1])?a[0]+a[1]:a[2];return{a:a[0],d:a[1],t:t}}
function sideTot(kind,b){ // [attacker, defender, total] for a battle, from the country-level rankings (battle-level totals as fallback)
  var m=ST[kind][b]||{},a=0,d=0;for(var e in m){if(D.ents[e][0]!=="country")continue;a+=m[e][0];d+=m[e][1]}
  if(kind===0&&!(a+d)){var x=D.battles[b];return[x[6],x[7],x[6]+x[7]]}
  return[a,d,a+d]}
function selSide(kind,b,e,side){var v=val(kind,b,e);return v&&v[side]?fmt(v[side]):"–"}
function selCell(kind,b,e){var v=val(kind,b,e);if(!v)return"–";return fmt(v.t)}

function battleSet(){
  var s=[];
  D.battles.forEach(function(b,i){var d=b[2].slice(0,10);if((!st.from||d>=st.from)&&(!st.to||d<=st.to))s.push(i)});
  ["alliance","country","mu","user"].forEach(function(k){var e=st[k];if(e<0)return;var set=(k==="alliance"?AB[e]:boe[e])||new Set();s=s.filter(function(i){return set.has(i)})});
  if(st.country>=0&&st.cscope==="side")s=s.filter(function(i){var b=D.battles[i];return b[4]===st.country||b[5]===st.country});
  return s}
function sels(){var o=[];[["country",st.country],["mu",st.mu],["user",st.user]].forEach(function(p){if(p[1]>=0)o.push(p)});return o}


/* totals for the selected country over a set of battles */
function countryTotals(bs){
  var c=st.country,t={n:bs.length,att:0,def:0,won:0,lost:0,dmg:0,own:0,other:0,all:0,money:0,aD:0,dD:0};
  bs.forEach(function(i){var b=D.battles[i],v=val(0,i,c),m=val(1,i,c),tt=sideTot(0,i);t.all+=tt[2];if(m)t.money+=m.t;
    var isA=b[4]===c,isD=b[5]===c;if(isA)t.att++;if(isD)t.def++;
    if(b[8]&&(isA||isD)){var w=(isA&&b[8]==="attacker")||(isD&&b[8]==="defender");if(w)t.won++;else t.lost++}
    if(v){t.dmg+=v.t;t.aD+=v.a;t.dD+=v.d;var own=isA?v.a:isD?v.d:0;t.own+=own;t.other+=v.t-own}});
  return t}
function countryKpis(bs){var t=countryTotals(bs);return kpis([
  ["Battles involving "+nm(st.country),String(t.n)],["As attacker / defender",t.att+" / "+t.def],["Won / lost (ended)",t.won+" / "+t.lost],
  ["Country damage (all)",fmt(t.dmg)],["On own side",fmt(t.own)],["For the other side",fmt(t.other)],
  ["Damage as attacker / defender side",fmt(t.aD)+" / "+fmt(t.dD)],["Share of battle damage",t.all?(100*t.dmg/t.all).toFixed(1)+"%":"–"],["Money earned",fmt(t.money)]])}

/* ---------- widgets ---------- */
function kpis(items){return el("div",{class:"kpis"},items.map(function(x){return el("div",{class:"kpi"},[el("b",{text:x[1]}),el("span",{text:x[0]})])}))}
function mk(head,rows,numCols,selCols){
  var t=el("table"),h=el("tr");head.forEach(function(x,i){var c=(numCols.indexOf(i)>=0?"n ":"")+((selCols||[]).indexOf(i)>=0?"sel":"");h.appendChild(el("th",{text:x,class:c.trim()}))});t.appendChild(el("thead",null,[h]));
  var tb=el("tbody");rows.forEach(function(r){var tr=el("tr");r.forEach(function(c,i){var cl=(numCols.indexOf(i)>=0?"n ":"")+((selCols||[]).indexOf(i)>=0?"sel":"");var td=el("td",{class:cl.trim()});if(c&&c.node)td.appendChild(c.node);else td.textContent=c==null?"–":c;tr.appendChild(td)});tb.appendChild(tr)});t.appendChild(tb);
  return el("div",{class:"tw"},[t])}
function barCell(label,v,max){var n=el("div");n.appendChild(el("div",{text:label}));var b=el("div",{class:"bar"});b.style.width=Math.max(1,100*v/(max||1))+"%";n.appendChild(b);return{node:n}}
function dayChart(series,title){
  var mn="",mxT="";series.forEach(function(p){if(!mn||p[0]<mn)mn=p[0];if(p[0]>mxT)mxT=p[0]});
  var span=mn?(new Date(mxT)-new Date(mn))/864e5:0,L=span<3?13:10,days={};
  series.forEach(function(p){var d=p[0].slice(0,L);days[d]=(days[d]||0)+p[1]});
  var keys=Object.keys(days).sort(),card=el("div",{class:"card"},[el("h2",{text:title})]);
  if(!keys.length){card.appendChild(el("div",{class:"note",text:"No data in this selection."}));return card}
  var mx=Math.max.apply(null,keys.map(function(k){return days[k]}))||1,ch=el("div",{class:"chart"});
  keys.forEach(function(k){var c=el("div",{class:"col"});c.style.height=Math.max(2,100*days[k]/mx)+"%";c.addEventListener("mousemove",function(e){tip(e,k.replace("T"," ")+(L===13?":00":"")+": "+fmt(days[k]))});c.addEventListener("mouseleave",untip);ch.appendChild(c)});
  card.appendChild(ch);card.appendChild(el("div",{class:"axis"},[el("span",{text:keys[0].replace("T"," ")}),el("span",{text:keys[keys.length-1].replace("T"," ")})]));return card}
function chips(opts,key,cb){var seg=el("div",{class:"seg"});opts.forEach(function(o){var b=el("button",{class:"chip",text:o[1],"aria-pressed":String(st[key]===o[0])});b.onclick=function(){st[key]=o[0];if(cb)cb();render()};seg.appendChild(b)});return seg}

/* per-battle table shared by every tab: attacker, defender, totals per side, then the selected country / MU / player */
function battleRows(bs,kind){
  var rows=bs.map(function(i){var b=D.battles[i],t=sideTot(kind,i);return{i:i,b:b,t:t,sel:sels().map(function(p){var v=val(kind,i,p[1]);return v?v.t:0})}});
  if(st.sort==="total")rows.sort(function(x,y){return y.t[2]-x.t[2]});
  else if(st.sort==="sel"&&sels().length)rows.sort(function(x,y){return y.sel[sels().length-1]-x.sel[sels().length-1]});
  else rows.sort(function(x,y){return x.b[2]<y.b[2]?1:-1});
  return rows}
function battleHead(kind,extra){
  var w=kind===0?"damage":"money";
  var h=["Created","Battle","Region","Attacker","Defender","Total "+w,"Attacker "+w,"Defender "+w];
  var sc=[];sels().forEach(function(p){sc.push(h.length,h.length+1,h.length+2);h.push(tname(p[0])+" "+w+": "+nm(p[1]),"…for attacker","…for defender")});
  return{head:h.concat(extra||[]),sel:sc,num:[5,6,7].concat(sc)}}
function battleTable(bs,kind,title,extraHead,extraFn,numExtra){
  var card=el("div",{class:"card"},[el("h2",{text:title})]);
  if(numExtra===undefined)numExtra=false;
  var seg=chips([["date","Newest"],["total","Largest total"]].concat(sels().length?[["sel","Largest selected"]]:[]),"sort");card.appendChild(seg);
  var rows=battleRows(bs,kind),H=battleHead(kind,extraHead);
  var shown=rows.slice(0,st.limit).map(function(r){var b=r.b;
    var c=[fmtD(b[2]),b[1]+" …"+b[0].slice(-4),region(b),nm(b[4]),nm(b[5]),fmt(r.t[2]),fmt(r.t[0]),fmt(r.t[1])];
    sels().forEach(function(p){c.push(selCell(kind,r.i,p[1]),selSide(kind,r.i,p[1],"a"),selSide(kind,r.i,p[1],"d"))});
    return c.concat(extraFn?extraFn(r.i):[])});
  var nums=H.num.slice();if(numExtra&&extraHead)for(var q=0;q<extraHead.length;q++)nums.push(H.head.length-extraHead.length+q);
  card.appendChild(mk(H.head,shown,nums,H.sel));
  if(rows.length>st.limit){var m=el("button",{class:"chip",text:"Show more ("+(rows.length-st.limit)+" left)"});m.onclick=function(){st.limit+=100;render()};card.appendChild(m)}
  if(!rows.length)card.appendChild(el("div",{class:"note",text:"No battles match this selection."}));
  return card}

/* ---------- views ---------- */
function vDamage(v){
  var bs=battleSet(),spec=null;["user","mu","country","alliance"].forEach(function(k){if(!spec&&st[k]>=0)spec=[k,st[k]]});
  var by=st.by==="auto"?(spec?spec[0]:"battle"):st.by,tot=0,series=[];
  bs.forEach(function(i){var val0=spec?(val(0,i,spec[1])||{t:0}).t:sideTot(0,i)[2];tot+=val0;series.push([D.battles[i][2],val0])});
  if(st.country>=0)v.appendChild(countryKpis(bs));
  v.appendChild(kpis([["Battles",String(bs.length)],[spec?"Selected damage":"Total damage",fmt(tot)],["Avg per battle",fmt(bs.length?tot/bs.length:0)]]));
  v.appendChild(dayChart(series,(spec?"Damage by "+tname(spec[0])+" "+nm(spec[1]):"Total damage (both sides)")+" over time"));
  v.appendChild(battleTable(bs,0,"Battles"));
  var card=el("div",{class:"card"},[el("h2",{text:"Damage by entity (top 25)"}),chips([["auto","Auto"],["user","Player"],["mu","MU"],["country","Country"],["alliance","Alliance"]],"by")]);
  var agg={};bs.forEach(function(i){var m=ST[0][i]||{};for(var e in m){var t=D.ents[e][0];if(t!==(by==="battle"?"country":by))continue;var a=m[e],x=(a[0]||a[1])?a[0]+a[1]:a[2];var o=agg[e]=agg[e]||[0,0];o[0]+=x;o[1]++}});
  var arr=Object.keys(agg).map(function(e){return[+e,agg[e][0],agg[e][1]]}).sort(function(a,b){return b[1]-a[1]});
  var mx=arr.length?arr[0][1]:1;
  card.appendChild(mk([tname(by==="battle"?"country":by),"Battles","Damage"],arr.slice(0,25).map(function(r){return[nm(r[0]),String(r[2]),barCell(fmt(r[1]),r[1],mx)]}),[1,2]));
  v.appendChild(card)}

function vOrders(v){
  var bs=battleSet(),set=new Set(bs),agg={};
  D.orders.forEach(function(o){if(!set.has(o[0]))return;var e=o[2],t=D.ents[e][0];if(st.country>=0&&t==="country"&&e!==st.country)return;if(st.mu>=0&&t==="mu"&&e!==st.mu)return;
    var k=e+"|"+o[1],a=agg[k]=agg[k]||{e:e,side:o[1],n:0,first:o[3],last:o[4]};a.n++;if(o[3]<a.first)a.first=o[3];if(o[4]>a.last)a.last=o[4]});
  var arr=Object.keys(agg).map(function(k){return agg[k]}).sort(function(a,b){return b.n-a.n});
  if(st.country>=0){var oc=0,oa=0,od=0;D.orders.forEach(function(o){if(set.has(o[0])&&o[2]===st.country){oc++;if(o[1]==="a")oa++;else od++}});v.appendChild(kpis([["Battles ordered into by "+nm(st.country),String(oc)],["Ordered to attacker side",String(oa)],["Ordered to defender side",String(od)]]))}
  v.appendChild(kpis([["Battles in selection",String(bs.length)],["Distinct orders",String(arr.length)]]));
  var ob={};D.orders.forEach(function(o){var e=o[2];if(e===st.country||e===st.mu)(ob[o[0]]=ob[o[0]]||[]).push(nm(e)+" → "+(o[1]==="a"?"attacker":"defender"))});
  v.appendChild(battleTable(bs,0,"Battles with orders",sels().length?["Ordered (selected)"]:[],sels().length?function(i){return[(ob[i]||[]).join(", ")||"–"]}:null));
  var card=el("div",{class:"card"},[el("h2",{text:"Orders: countries and MUs ordered into battles (top 40)"}),el("div",{class:"note",text:"The API only exposes current orders, so order history starts when collection began."})]);
  card.appendChild(mk(["Type","Entity","Side","Battles","First seen","Last seen"],arr.slice(0,40).map(function(a){return[tname(D.ents[a.e][0]),nm(a.e),a.side==="a"?"attacker":"defender",String(a.n),fmtD(a.first),fmtD(a.last)]}),[3]));
  v.appendChild(card)}

function inScope(e,rowCountry,rowMu){ // does a bounty ranking row belong to the current country / MU / player selection?
  var t=D.ents[e][0];
  if(st.user>=0)return t==="user"&&e===st.user;
  if(st.mu>=0)return(t==="mu"&&e===st.mu)||(t==="user"&&rowMu===st.mu);
  if(st.country>=0)return(t==="country"&&e===st.country)||(t==="user"&&rowCountry===st.country)||(t==="mu"&&(relMu[e]===st.country));
  return true}
function vBounty(v){
  var bs=battleSet(),spec=null;["user","mu","country"].forEach(function(k){if(!spec&&st[k]>=0)spec=[k,st[k]]});
  var tot=0,series=[];bs.forEach(function(i){var x=spec?(val(1,i,spec[1])||{t:0}).t:sideTot(1,i)[2];tot+=x;series.push([D.battles[i][2],x])});
  if(st.country>=0){var t0=countryTotals(bs);v.appendChild(kpis([["Money earned by "+nm(st.country),fmt(t0.money)],["Share of all battle money",(function(){var a=0;bs.forEach(function(i){a+=sideTot(1,i)[2]});return a?(100*t0.money/a).toFixed(1)+"%":"–"})()]]))}
  var allM=0,allD=0,selM=0,selD=0;bs.forEach(function(i){allM+=sideTot(1,i)[2];allD+=sideTot(0,i)[2];if(spec){var m=val(1,i,spec[1]),d=val(0,i,spec[1]);if(m)selM+=m.t;if(d)selD+=d.t}});
  var perM=function(m,d){return d>0?fmt(m/(d/1e6)):"–"};
  v.appendChild(kpis([["Battles",String(bs.length)],[spec?"Selected money earned":"Money earned (all)",fmt(tot)],["Money per 1M damage (all battles)",perM(allM,allD)]].concat(spec?[[tname(spec[0])+" "+nm(spec[1])+": money per 1M damage",perM(selM,selD)]]:[])));
  v.appendChild(dayChart(series,"Money earned in battles (battle money ranking)"+(spec?" · "+tname(spec[0])+" "+nm(spec[1]):"")));
  var per=function(m,d){return d>0?fmt(m/(d/1e6)):"–"};
  var pHead=["Money per 1M damage (all)"].concat(sels().map(function(p){return nm(p[1])+": money per 1M dmg"}));

  c3.appendChild(el("div",{class:"note",text:"Region tax /h is the game’s own figure (employee + manager income tax) for all companies in the region; the citizens’ share is estimated by company count, so owed amounts are approximate. ⚑ marks companies abroad."}));v.appendChild(c3);
  var TH=D.taxHist,c5=el("div",{class:"card"});c5.appendChild(el("h2",{text:"Tax owed, tracked history (selected date range)"}));
  var days=TH&&TH.days?Object.keys(TH.days).sort().filter(function(d){return(!st.from||d>=st.from)&&(!st.to||d<=st.to)}):[];
  if(!days.length){c5.appendChild(el("div",{class:"note",text:TH&&TH.firstT?"Tracking began "+fmtD(new Date(TH.firstT).toISOString())+" UTC; there is no tracked time inside the selected dates yet. Widen the date range or wait for more scheduled runs.":"No tax history yet. It starts with the next scheduled refresh and grows with each run."}))}
  else{
    var share={};rs.forEach(function(r){share[r.id]=r.share});var tot=0,hrs=0,per={};
    var drows=days.map(function(d){var x=TH.days[d],o=0;for(var rid in x.r){var a=(share[rid]||0)*x.r[rid];o+=a;per[rid]=(per[rid]||0)+a}tot+=o;hrs+=x.h;return{day:d,h:x.h,o:o}});
    var kk=el("div",{class:"kpis"});[[fmt(tot),"Owed in range (tracked)"],[fmt(hrs),"Hours tracked"],[days.length,"Days with data"]].forEach(function(x){kk.appendChild(el("div",{class:"kpi"},[el("b",{text:String(x[0])}),el("span",{text:x[1]})]))});c5.appendChild(kk);
    c5.appendChild(coTable([["Day (UTC)",function(r){return r.day}],["Hours tracked",function(r){return r.h.toFixed(1)},1],["Owed",function(r){return fmt(r.o)},1]],drows));
    var prow=rs.map(function(r){return{name:r.name,host:r.host,o:per[r.id]||0}}).filter(function(r){return r.o>0}).sort(function(a,b){return b.o-a.o});
    c5.appendChild(el("h2",{text:"By region"}));c5.appendChild(coTable([["Region",function(r){return r.name}],["Host country",function(r){return r.host}],["Owed in range",function(r){return fmt(r.o)},1]],prow));
    c5.appendChild(el("div",{class:"note",text:"Each refresh records every region’s hourly tax; the rate at one check is held until the next (max 6h). Checks every ~"+(TH.everyMinutes||"?")+" min, tracking began "+fmtD(new Date(TH.firstT).toISOString())+" UTC; earlier days are empty. The citizens’ share is estimated by company count, so amounts are approximate."}))}
  v.appendChild(c5);
  var c4=el("div",{class:"card"});c4.appendChild(el("h2",{text:"Companies"}));var sorted=list.slice().sort(function(a,b){return b.value-a.value});
  c4.appendChild(coTable([["Company",function(r){return r.name}],["Owner",function(r){return coName(r.owner)}],["Item",function(r){return r.item}],["Region",function(r){return r.regionName}],["Host country",function(r){return r.hostName+(r.domestic?"":" ⚑")}],["Est. value",function(r){return fmt(r.value)},1]],sorted.slice(0,CO.limit)));
  if(sorted.length>CO.limit){var m=el("button",{class:"chip",text:"Show more ("+(sorted.length-CO.limit)+" left)"});m.onclick=function(){CO.limit+=200;render()};c4.appendChild(m)}
  v.appendChild(c4)}

var TABS=[["damage","Damage",vDamage],["orders","Orders",vOrders],["bounty","Bounty",vBounty],["bpm","Bounty per 1M damage",vBpm],["contracts","Contracts",vContracts],["companies","Company locations",vCompanies]];
function render(){
  var tabs=$("tabs");tabs.textContent="";TABS.forEach(function(t){var b=el("button",{role:"tab",text:t[1],"aria-selected":String(st.tab===t[0])});b.onclick=function(){st.tab=t[0];st.limit=50;try{location.hash=t[0]}catch(e){}render()};tabs.appendChild(b)});
  var v=$("view");v.textContent="";TABS.filter(function(t){return t[0]===st.tab})[0][2](v)}

/* ---------- filters (cascading: country -> MU, player; MU -> player) ---------- */
function entByName(type,text){text=(text||"").trim().toLowerCase();if(!text)return-1;var l=entsOf[type];for(var i=0;i<l.length;i++){var e=D.ents[l[i]];if(e[1]===text||(e[2]&&e[2].toLowerCase()===text))return l[i]}return-2}
function fillList(dl,idxs){dl.textContent="";idxs.slice(0,1500).forEach(function(i){if(D.ents[i][2])dl.appendChild(el("option",{value:D.ents[i][2]}))})}
function byDmg(a,b){return(totDmg[b]||0)-(totDmg[a]||0)}
function allowedCountries(){ // countries the current alliance / country selection allows (null = any)
  if(st.country>=0)return new Set([st.country]);
  if(st.alliance>=0)return new Set((D.alliances||{})[st.alliance]||[]);
  return null}
function muOptions(){var ac=allowedCountries();var l=entsOf.mu.filter(function(i){return D.ents[i][2]&&(!ac||ac.has(relMu[i]))});return l.sort(byDmg)}
function userOptions(){var ac=allowedCountries();var l=entsOf.user.filter(function(i){if(!D.ents[i][2])return false;var r=relUser[i]||[-1,-1];if(st.mu>=0)return r[1]===st.mu;if(!ac)return true;return ac.has(r[0])||(r[0]<0&&ac.has(relMu[r[1]]))});return l.sort(byDmg)}
function fillCountries(){var sel=$("f-country"),keep=sel.value,members=st.alliance>=0?new Set((D.alliances||{})[st.alliance]||[]):null;
  sel.textContent="";sel.appendChild(el("option",{value:"",text:members?"All "+members.size+" alliance members":"All"}));
  entsOf.country.slice().filter(function(i){return !members||members.has(i)}).sort(function(a,b){return nm(a).localeCompare(nm(b))}).forEach(function(i){sel.appendChild(el("option",{value:String(i),text:nm(i)}))});
  var ok=[].slice.call(sel.options).some(function(o){return o.value===keep});sel.value=ok?keep:""}
function refreshLists(){fillList($("dl-mu"),muOptions());fillList($("dl-user"),userOptions());
  $("f-mu").placeholder=st.country>=0?"MUs of "+nm(st.country):st.alliance>=0?"MUs of "+nm(st.alliance)+" countries":"all (or type a name)";
  $("f-user").placeholder=st.mu>=0?"players of "+nm(st.mu):st.country>=0?"players of "+nm(st.country):st.alliance>=0?"players of "+nm(st.alliance)+" countries":"all (or type a name)"}
function readFilters(src){
  st.from=$("f-from").value;st.to=$("f-to").value;
  var prevA=st.alliance;st.alliance=$("f-alliance").value===""?-1:+$("f-alliance").value;
  if(src==="alliance"||prevA!==st.alliance)fillCountries();
  var prevC=st.country;st.country=$("f-country").value===""?-1:+$("f-country").value;
  var hint=[];
  if(src==="country"||src==="alliance"||prevC!==st.country){ // parent changed: drop children that no longer fit
    var ac0=allowedCountries();
    if(st.mu>=0&&ac0&&!ac0.has(relMu[st.mu])){$("f-mu").value="";st.mu=-1}
    var u=entByName("user",$("f-user").value);if(u>=0&&ac0){var r=relUser[u]||[-1,-1];if(!ac0.has(r[0])&&!ac0.has(relMu[r[1]])){$("f-user").value=""}}}
  var m=entByName("mu",$("f-mu").value);if(m===-2){hint.push("No military unit named “"+$("f-mu").value+"” in the data.");m=-1}
  if(src==="mu"||m!==st.mu){var u2=entByName("user",$("f-user").value);if(u2>=0&&m>=0&&(relUser[u2]||[-1,-1])[1]!==m)$("f-user").value=""}
  st.mu=m;
  var u3=entByName("user",$("f-user").value);if(u3===-2){hint.push("No player named “"+$("f-user").value+"” in the data (names are known for the top players of each battle).");u3=-1}st.user=u3;
  $("hint").textContent=hint.join(" ");st.limit=50;refreshLists();scopeChip();render()}
function scopeChip(){var x=$("scope");if(x)x.remove();if(st.country<0)return;var b=el("button",{class:"chip",id:"scope","aria-pressed":String(st.cscope==="side"),text:"Only battles where "+nm(st.country)+" is attacker or defender"});b.onclick=function(){st.cscope=st.cscope==="side"?"any":"side";st.limit=50;scopeChip();render()};$("presets").appendChild(b)}
function presets(){var p=$("presets");p.textContent="";p.appendChild(el("span",{text:"Quick range:"}));[["24h",1],["3 days",3],["7 days",7],["All data",0]].forEach(function(x){var b=el("button",{class:"chip",text:x[0]});b.onclick=function(){setRange(x[1]);readFilters("date")};p.appendChild(b)})}
function setRange(days){var mx=D.battles.length?D.battles[D.battles.length-1][2].slice(0,10):new Date().toISOString().slice(0,10),mn=D.battles.length?D.battles[0][2].slice(0,10):mx;
  if(!days){$("f-from").value=mn;$("f-to").value=mx;return}var d=new Date(mx+"T00:00:00Z");d.setUTCDate(d.getUTCDate()-days+1);var f=d.toISOString().slice(0,10);$("f-from").value=f<mn?mn:f;$("f-to").value=mx}
function fillFilters(){
  function opts(sel,type,byName){var l=entsOf[type].slice();l.sort(byName?function(a,b){return nm(a).localeCompare(nm(b))}:byDmg);l.forEach(function(i){sel.appendChild(el("option",{value:String(i),text:nm(i)}))})}
  opts($("f-alliance"),"alliance");opts($("f-country"),"country",true);
  var mn=D.battles.length?D.battles[0][2].slice(0,10):"",mx=D.battles.length?D.battles[D.battles.length-1][2].slice(0,10):"";
  ["f-from","f-to"].forEach(function(i){$(i).min=mn;$(i).max=mx;$(i).addEventListener("change",function(){readFilters("date")})});
  $("f-alliance").addEventListener("change",function(){readFilters("alliance")});$("f-country").addEventListener("change",function(){readFilters("country")});
  $("f-mu").addEventListener("change",function(){readFilters("mu")});$("f-user").addEventListener("change",function(){readFilters("user")});
  presets();setRange(0);refreshLists()}

fetch("data.json").then(function(r){return r.json()}).then(function(d){
  D=d;build();fillFilters();
  var h=(location.hash||"").slice(1);if(TABS.some(function(t){return t[0]===h}))st.tab=h;
  $("meta").textContent="Updated "+fmtD(D.generated)+" UTC · "+D.battles.length+" battles · data from api2.warera.io · collected since "+fmtD(D.since);
  readFilters("init");
}).catch(function(e){$("meta").textContent="Could not load data.json: "+e.message});
addEventListener("hashchange",function(){var h=(location.hash||"").slice(1);if(D&&TABS.some(function(t){return t[0]===h})){st.tab=h;render()}});
})();
</script>
