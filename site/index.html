(function(){

/* ---------- indexes ---------- */
var AB={},ST=[{},{}],boe={},relMu={},relUser={},entsOf={country:[],mu:[],user:[],alliance:[]},totDmg={};
function build(){

function sels(){var o=[];[["country",st.country],["mu",st.mu],["user",st.user]].forEach(function(p){if(p[1]>=0)o.push(p)});return o}


/* totals for the selected country over a set of battles */

/* per-battle table shared by every tab: attacker, defender, totals per side, then the selected country / MU / player */

  function done(ok){var o=btn.textContent==="Copied"||btn.textContent==="Select & copy"?"Copy":btn.textContent;btn.textContent=ok?"Copied":"Select & copy";setTimeout(function(){btn.textContent=o},1500)}

function battleTable(bs,kind,title,extraHead,extraFn,numExtra){
  var card=el("div",{class:"card"},[el("h2",{text:title})]);

  var seg=chips([["date","Newest"],["total","Largest total"]].concat(sels().length?[["sel","Largest selected"]]:[]),"sort");card.appendChild(seg);

/* ---------- views ---------- */
function vDamage(v){

  var agg={};bs.forEach(function(i){var m=ST[0][i]||{};for(var e in m){var t=D.ents[e][0];if(t!==(by==="battle"?"country":by))continue;var a=m[e],x=(a[0]||a[1])?a[0]+a[1]:a[2];var o=agg[e]=agg[e]||[0,0];o[0]+=x;o[1]++}});
  var arr=Object.keys(agg).map(function(e){return[+e,agg[e][0],agg[e][1]]}).sort(function(a,b){return b[1]-a[1]});

function vBpm(v){

    el("div",{class:"note",text:"Click a column heading to sort by it; click again to reverse."+(isMu?" Military units are those based in the alliance's countries and active in the range; small units can give extreme figures, so sort by Damage or Money to see the big ones.":"")})]);
  if(note)card.appendChild(el("div",{class:"note",text:note}));
  card.appendChild(el("div",{class:"note",text:"Damage and money are those of each "+(isMu?"unit's members":"country's citizens")+" in the battles in range (battle money ranking, damage ranking). Attacker / defender is the side they fought on. Only battles in the collected scope are counted, so for alliances other than the one collected, countries show only their part in those battles."}));
  var shown=rows.slice(0,isMu?st.limit*2:rows.length);
  var mx=Math.max.apply(null,shown.map(function(r){return per(r.m,r.d)||0}).concat([1]));
  var tr=function(r){var o=[nm(r.c)];if(isMu)o.push(nm(relMu[r.c]));return o.concat([String(r.n),fmt(r.d/1e6),fmt(r.m),barCell(pf(per(r.m,r.d)),per(r.m,r.d)||0,mx),fmt(r.dA/1e6),pf(per(r.mA,r.dA)),fmt(r.dD/1e6),pf(per(r.mD,r.dD))])};
  var mvp=function(a){var x=a.splice(a.length-5,1)[0];a.splice(2,0,x);return a};
  var all=shown.map(tr).map(mvp);
  all.push(mvp(["Total"].concat(isMu?[""]:[],["",fmt(T.d/1e6),fmt(T.m),pf(per(T.m,T.d)),fmt(T.dA/1e6),pf(per(T.mA,T.dA)),fmt(T.dD/1e6),pf(per(T.mD,T.dD))])));
  var first=isMu?2:1,numCols=[];for(var q=first;q<COLS.length;q++)numCols.push(q);
  var tw=mk(COLS.map(function(c){return c[0]}),all,numCols);
  [].slice.call(tw.querySelectorAll("th")).forEach(function(th,i){th.style.cursor="pointer";th.setAttribute("aria-sort",i===st.bcol?(st.bdir>0?"ascending":"descending"):"none");
    if(i===st.bcol)th.textContent=COLS[i][0]+(st.bdir>0?" ▲":" ▼");
    th.onclick=function(){if(st.bcol===i)st.bdir=-st.bdir;else{st.bcol=i;st.bdir=i<=(isMu?1:0)?1:-1}render()}});
  card.appendChild(tw);
  if(isMu&&rows.length>shown.length){var more=el("button",{class:"chip",text:"Show more ("+(rows.length-shown.length)+" left)"});more.onclick=function(){st.limit+=50;render()};card.appendChild(more)}
  v.appendChild(card)}

var TABS=[["damage","Damage",vDamage],["bpm","Bounty per 1M damage",vBpm]];
function render(){
  var tabs=$("tabs");tabs.textContent="";TABS.forEach(function(t){var b=el("button",{role:"tab",text:t[1],"aria-selected":String(st.tab===t[0])});b.onclick=function(){st.tab=t[0];st.limit=50;try{location.hash=t[0]}catch(e){}render()};tabs.appendChild(b)});
  var v=$("view");v.textContent="";TABS.filter(function(t){return t[0]===st.tab})[0][2](v)}

/* ---------- filters (cascading: country -> MU, player; MU -> player) ---------- */
function entByName(type,text){text=(text||"").trim().toLowerCase();if(!text)return-1;var l=entsOf[type];for(var i=0;i<l.length;i++){var e=D.ents[l[i]];if(e[1]===text||(e[2]&&e[2].toLowerCase()===text))return l[i]}return-2}
function fillList(dl,idxs){dl.textContent="";idxs.slice(0,1500).forEach(function(i){if(D.ents[i][2])dl.appendChild(el("option",{value:D.ents[i][2]}))})}
function byDmg(a,b){return(totDmg[b]||0)-(totDmg[a]||0)}
function allowedCountries(){ // countries the current alliance / country selection allows (null = any)
  if(st.country>=0)return new Set([st.country]);
  if(st.alliance>=0)return new Set((D.alliances||{})[st.alliance]||[]);
  return null}
function muOptions(){var ac=allowedCountries();var l=entsOf.mu.filter(function(i){return D.ents[i][2]&&(!ac||ac.has(relMu[i]))});return l.sort(byDmg)}
function userOptions(){var ac=allowedCountries();var l=entsOf.user.filter(function(i){if(!D.ents[i][2])return false;var r=relUser[i]||[-1,-1];if(st.mu>=0)return r[1]===st.mu;if(!ac)return true;return ac.has(r[0])||(r[0]<0&&ac.has(relMu[r[1]]))});return l.sort(byDmg)}
function fillCountries(){var sel=$("f-country"),keep=sel.value,members=st.alliance>=0?new Set((D.alliances||{})[st.alliance]||[]):null;
  sel.textContent="";sel.appendChild(el("option",{value:"",text:members?"All "+members.size+" alliance members":"All"}));
  entsOf.country.slice().filter(function(i){return !members||members.has(i)}).sort(function(a,b){return nm(a).localeCompare(nm(b))}).forEach(function(i){sel.appendChild(el("option",{value:String(i),text:nm(i)}))});
  var ok=[].slice.call(sel.options).some(function(o){return o.value===keep});sel.value=ok?keep:""}
function refreshLists(){fillList($("dl-mu"),muOptions());fillList($("dl-user"),userOptions());
  $("f-mu").placeholder=st.country>=0?"MUs of "+nm(st.country):st.alliance>=0?"MUs of "+nm(st.alliance)+" countries":"all (or type a name)";
  $("f-user").placeholder=st.mu>=0?"players of "+nm(st.mu):st.country>=0?"players of "+nm(st.country):st.alliance>=0?"players of "+nm(st.alliance)+" countries":"all (or type a name)"}
function readFilters(src){
  st.from=$("f-from").value;st.to=$("f-to").value;
  var prevA=st.alliance;st.alliance=$("f-alliance").value===""?-1:+$("f-alliance").value;
  if(src==="alliance"||prevA!==st.alliance)fillCountries();
  var prevC=st.country;st.country=$("f-country").value===""?-1:+$("f-country").value;
  var hint=[];
  if(src==="country"||src==="alliance"||prevC!==st.country){ // parent changed: drop children that no longer fit
    var ac0=allowedCountries();
    if(st.mu>=0&&ac0&&!ac0.has(relMu[st.mu])){$("f-mu").value="";st.mu=-1}
    var u=entByName("user",$("f-user").value);if(u>=0&&ac0){var r=relUser[u]||[-1,-1];if(!ac0.has(r[0])&&!ac0.has(relMu[r[1]])){$("f-user").value=""}}}
  var m=entByName("mu",$("f-mu").value);if(m===-2){hint.push("No military unit named “"+$("f-mu").value+"” in the data.");m=-1}
  if(src==="mu"||m!==st.mu){var u2=entByName("user",$("f-user").value);if(u2>=0&&m>=0&&(relUser[u2]||[-1,-1])[1]!==m)$("f-user").value=""}
  st.mu=m;
  var u3=entByName("user",$("f-user").value);if(u3===-2){hint.push("No player named “"+$("f-user").value+"” in the data (names are known for the top players of each battle).");u3=-1}st.user=u3;
  $("hint").textContent=hint.join(" ");st.limit=50;refreshLists();scopeChip();render()}
function scopeChip(){var x=$("scope");if(x)x.remove();if(st.country<0)return;var b=el("button",{class:"chip",id:"scope","aria-pressed":String(st.cscope==="side"),text:"Only battles where "+nm(st.country)+" is attacker or defender"});b.onclick=function(){st.cscope=st.cscope==="side"?"any":"side";st.limit=50;scopeChip();render()};$("presets").appendChild(b)}
function presets(){var p=$("presets");p.textContent="";p.appendChild(el("span",{text:"Quick range:"}));[["24h",1],["3 days",3],["7 days",7],["All data",0]].forEach(function(x){var b=el("button",{class:"chip",text:x[0]});b.onclick=function(){setRange(x[1]);readFilters("date")};p.appendChild(b)})}
function setRange(days){var mx=D.battles.length?D.battles[D.battles.length-1][2].slice(0,10):new Date().toISOString().slice(0,10),mn=D.battles.length?D.battles[0][2].slice(0,10):mx;
  if(!days){$("f-from").value=mn;$("f-to").value=mx;return}var d=new Date(mx+"T00:00:00Z");d.setUTCDate(d.getUTCDate()-days+1);var f=d.toISOString().slice(0,10);$("f-from").value=f<mn?mn:f;$("f-to").value=mx}
function fillFilters(){
  function opts(sel,type,byName){var l=entsOf[type].slice();l.sort(byName?function(a,b){return nm(a).localeCompare(nm(b))}:byDmg);l.forEach(function(i){sel.appendChild(el("option",{value:String(i),text:nm(i)}))})}
  opts($("f-alliance"),"alliance");
  (function(){var a=$("f-alliance"),o=[].slice.call(a.options).filter(function(x){return x.textContent==="The Emerald Accord"})[0];
    if(o){a.value=o.value;[].slice.call(a.options).forEach(function(x){if(x!==o)a.removeChild(x)});a.disabled=true;a.title="The alliance is fixed to The Emerald Accord"}})();opts($("f-country"),"country",true);
  var mn=D.battles.length?D.battles[0][2].slice(0,10):"",mx=D.battles.length?D.battles[D.battles.length-1][2].slice(0,10):"";
  ["f-from","f-to"].forEach(function(i){$(i).min=mn;$(i).max=mx;$(i).addEventListener("change",function(){readFilters("date")})});
  $("f-alliance").addEventListener("change",function(){readFilters("alliance")});$("f-country").addEventListener("change",function(){readFilters("country")});
  $("f-mu").addEventListener("change",function(){readFilters("mu")});$("f-user").addEventListener("change",function(){readFilters("user")});
  presets();setRange(0);refreshLists()}

function stale(){var a=(Date.now()-Date.parse(D.generated))/36e5;if(a>3)$("meta").insertAdjacentElement("afterend",el("div",{class:"hint",text:"Data is "+Math.round(a)+" h old: the hourly refresh may have failed or been skipped."}))}
fetch("data.json").then(function(r){return r.json()}).then(function(d){
  D=d;build();fillFilters();stale();
  var h=(location.hash||"").slice(1);if(TABS.some(function(t){return t[0]===h}))st.tab=h;
  $("meta").textContent="Updated "+fmtD(D.generated)+" UTC · "+D.battles.length+" battles · data from api2.warera.io · collected since "+fmtD(D.since);
  readFilters("init");
}).catch(function(e){$("meta").textContent="Could not load data.json: "+e.message});
addEventListener("hashchange",function(){var h=(location.hash||"").slice(1);if(D&&TABS.some(function(t){return t[0]===h})){st.tab=h;render()}});
})();
</script>
