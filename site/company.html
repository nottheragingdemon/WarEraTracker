  if(st.host<0||!hostN[st.host]){var ie=Object.keys(hostN).filter(function(k){return nm(+k)==="Ireland"})[0];   // Ireland first, else the largest host
    st.host=+(ie||Object.keys(hostN).sort(function(a,b){return hostN[b]-hostN[a]})[0]);if(isNaN(st.host))st.host=-1}
  var hs=$("f-host");hs.textContent="";Object.keys(hostN).sort(function(a,b){return nm(+a).localeCompare(nm(+b))}).forEach(function(k){hs.appendChild(el("option",{value:k,text:nm(+k)+" ("+hostN[k]+")"}))});hs.value=String(st.host);
  function fillReg(){
    var regN={},R=D.regionsNow;D.companies.forEach(function(c){if(hostOf(c)===st.host)regN[c[4]]=(regN[c[4]]||0)+1});
    var rs=$("f-region"),tot=0;rs.textContent="";Object.keys(regN).forEach(function(k){tot+=regN[k]});
    rs.appendChild(el("option",{value:ALL_REGIONS,text:"All regions ("+tot+")"}));
    Object.keys(regN).sort(function(a,b){return R[a][0].localeCompare(R[b][0])}).forEach(function(k){var c=coreOf(k);
      rs.appendChild(el("option",{value:k,text:R[k][0]+" ("+regN[k]+")"+(c>=0&&c!==st.host?" · conquered from "+nm(c):"")}))});
    if(st.firstReg){st.firstReg=false;var ni=Object.keys(regN).filter(function(k){return R[k][0]==="Northern Ireland"})[0];if(ni){st.region=ni;st.regionByDefault=true}}   // default view: Northern Ireland
    if(st.region!==ALL_REGIONS&&!regN[st.region])st.region=ALL_REGIONS;
    rs.value=st.region}
  function fillSrc(){
    var srcN={},tot=0;D.companies.forEach(function(c){if(hostOf(c)===st.host&&regMatch(c[4])&&c[5]>=0){srcN[c[5]]=(srcN[c[5]]||0)+1;tot++}});
    var ss=$("f-src");ss.textContent="";ss.appendChild(el("option",{value:String(ALL_OWNERS),text:(agreedOf(st.host)?"All agreed countries (":"All owners (")+tot+")"}));
    var keys=Object.keys(srcN).sort(function(a,b){return srcN[b]-srcN[a]||nm(+a).localeCompare(nm(+b))});
    [["Emerald Accord",keys.filter(function(k){return ea&&ea.has(+k)})],["Other countries",keys.filter(function(k){return !(ea&&ea.has(+k))})]].forEach(function(g){
      if(!g[1].length)return;var og=el("optgroup",{label:g[0]});g[1].forEach(function(k){og.appendChild(el("option",{value:k,text:nm(+k)+" ("+srcN[k]+")"}))});ss.appendChild(og)});
    if(st.firstSrc){st.firstSrc=false;var uk=Object.keys(srcN).filter(function(k){return nm(+k)==="United Kingdom"})[0];if(uk)st.src=+uk}   // default view: United Kingdom
    if(st.src!==ALL_OWNERS&&!srcN[st.src])st.src=ALL_OWNERS;
    ss.value=String(st.src)}
  fillReg();fillSrc();
  hs.onchange=function(){st.host=+this.value;st.region=ALL_REGIONS;st.regionByDefault=false;st.src=ALL_OWNERS;st.limit=0;fillReg();fillSrc();render()};
  $("f-region").onchange=function(){st.region=this.value;st.regionByDefault=false;st.limit=0;fillSrc();render()};
  $("f-src").onchange=function(){st.src=+this.value;st.limit=0;
    // the opening view's Northern Ireland only suits the UK: another source shows all of Ireland unless a region was picked by hand
    if(st.regionByDefault){st.regionByDefault=false;st.region=ALL_REGIONS;fillReg();var keep=st.src;fillSrc();st.src=keep;$("f-src").value=String(keep)}
    render()}}
function stale(){window.weStale(D.generated)}
fetch("data.json").then(function(r){return r.json()}).then(async function(d){
  D=d;stale();D.companies=D.companies||[];
  try{var cx=window.weUnpackCompanies(await fetch("company-data.json").then(function(r){return r.json()}));D.wageHist=cx.wageHist||[];D.wageHistReg=cx.wageHistReg||[];D.companies=cx.companies||D.companies||[]}catch(e){D.wageHist=D.wageHist||[];D.companies=D.companies||[]}
  var TH=D.taxHist,days=TH&&TH.days?Object.keys(TH.days).sort():[];
  st.month=(days.length?days[days.length-1]:new Date().toISOString().slice(0,10)).slice(0,7);
  $("f-month").value=st.month;$("f-month").onchange=function(){if(this.value){st.month=this.value;render()}};
  fillSelects();
  $("meta").textContent="Updated "+fmtD(D.generated)+" UTC"+(D.companiesAt?" · companies collected "+fmtD(D.companiesAt)+" UTC":"")+" · data from api2.warera.io";
  render();
}).catch(function(e){$("meta").textContent="Could not load data.json: "+e.message});
})();
