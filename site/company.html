    kids.push(tbl([["Day",function(r){return r[1]}],["Total (game streams)",function(r){return m0(+r[4].total||0)},1]].concat(STREAMS.map(function(x){return[x[1],function(r){return m0(+r[4][x[0]]||0)},1]})).concat([["Market tax (est.)",function(r){return m1(mt(r))},1],["Treasury (end of day)",function(r){return m0(r[3])},1]]),hist.slice().reverse()));
    kids.push(note("Each day is the average hourly rate across that day’s checks × 24. “Partial” marks days with fewer than 12 checks (for example today, or when tracking started)."))}
  if(ea){var er=ea.map(function(c){var r=(D.countryNow||{})[String(c)],i=r&&r[5];return i?{c:c,i:i,t:(i.total!=null?+i.total:0)*24}:null}).filter(Boolean).sort(function(a,b){return b.t-a.t});
    if(er.length){kids.push(el("h3",{text:"All Emerald Accord nations, per day"}));
      kids.push(tbl([["Nation",function(r){return nm(r.c)+(r.c===st.host?" ●":"")}],["Total",function(r){return m0(r.t+marketEst(r.c).perDay)},1]].concat(STREAMS.map(function(x){return[x[1],function(r){return m0((+r.i[x[0]]||0)*24)},1]})).concat([["Market tax (est.)",function(r){var e=marketEst(r.c);return m1(e.perDay)},1]]),er))}}
  return card("Country income per day: "+hn,kids)}

/* ---------- controls ---------- */
function fillSelects(){
  var hostN={};D.companies.forEach(function(c){var h=hostOf(c);if(h>=0)hostN[h]=(hostN[h]||0)+1});
  var ea=null;Object.keys(D.alliances||{}).forEach(function(a){if(nm(+a)==="The Emerald Accord")ea=new Set(D.alliances[a])});
  if(st.host<0||!hostN[st.host]){st.host=+Object.keys(hostN).sort(function(a,b){return hostN[b]-hostN[a]})[0];if(isNaN(st.host))st.host=-1}
  var hs=$("f-host");hs.textContent="";Object.keys(hostN).sort(function(a,b){return nm(+a).localeCompare(nm(+b))}).forEach(function(k){hs.appendChild(el("option",{value:k,text:nm(+k)+" ("+hostN[k]+")"}))});hs.value=String(st.host);
  function fillSrc(){
    var srcN={},tot=0;D.companies.forEach(function(c){if(hostOf(c)===st.host&&c[5]>=0){srcN[c[5]]=(srcN[c[5]]||0)+1;tot++}});
    var ss=$("f-src");ss.textContent="";ss.appendChild(el("option",{value:String(ALL_OWNERS),text:"All owners ("+tot+")"}));
    var keys=Object.keys(srcN).sort(function(a,b){return srcN[b]-srcN[a]||nm(+a).localeCompare(nm(+b))});
    [["Emerald Accord",keys.filter(function(k){return ea&&ea.has(+k)})],["Other countries",keys.filter(function(k){return !(ea&&ea.has(+k))})]].forEach(function(g){
      if(!g[1].length)return;var og=el("optgroup",{label:g[0]});g[1].forEach(function(k){og.appendChild(el("option",{value:k,text:nm(+k)+" ("+srcN[k]+")"}))});ss.appendChild(og)});
    if(st.src!==ALL_OWNERS&&!srcN[st.src]){var other=keys.filter(function(k){return +k!==st.host});st.src=other.length?+other[0]:ALL_OWNERS}
    ss.value=String(st.src)}
  fillSrc();
  hs.onchange=function(){st.host=+this.value;st.limit=0;fillSrc();render()};
  $("f-src").onchange=function(){st.src=+this.value;st.limit=0;render()}}
function stale(){window.weStale(D.generated)}
fetch("data.json").then(function(r){return r.json()}).then(async function(d){
  D=d;stale();D.companies=D.companies||[];
  try{var cx=await fetch("company-data.json").then(function(r){return r.json()});D.wageHist=cx.wageHist||[]}catch(e){D.wageHist=D.wageHist||[]}
  var TH=D.taxHist,days=TH&&TH.days?Object.keys(TH.days).sort():[];
  st.month=(days.length?days[days.length-1]:new Date().toISOString().slice(0,10)).slice(0,7);
  $("f-month").value=st.month;$("f-month").onchange=function(){if(this.value){st.month=this.value;render()}};
  fillSelects();
  $("meta").textContent="Updated "+fmtD(D.generated)+" UTC"+(D.companiesAt?" · companies collected "+fmtD(D.companiesAt)+" UTC":"")+" · data from api2.warera.io";
  render();
}).catch(function(e){$("meta").textContent="Could not load data.json: "+e.message});
})();
