<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company tax tracker</title>
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
</head>
<body>
<header>
  <div class="header-top">
    <a class="brand" href="index.html"><h1>🏭 Company tax tracker</h1><div class="tag">Tax owed on one country’s companies standing in another</div></a>
    <div class="header-actions">
      <div id="theme-switch" class="theme-switch" role="group" aria-label="Colour theme">
        <button type="button" data-theme-pref="auto" aria-pressed="true" title="Follow your device's light or dark setting">Auto</button>
        <button type="button" data-theme-pref="light" aria-pressed="false" aria-label="Light" title="Light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        <button type="button" data-theme-pref="dark" aria-pressed="false" aria-label="Dark" title="Dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      </div>
    </div>
  </div>
  <nav class="apps" id="apps"><a href="index.html">WarEra Tracker</a><a href="company.html" aria-current="page">Company tax tracker</a><a href="ask.html">Ask WarEra</a><a href="https://we.hawtre.net/" target="_blank" rel="noopener noreferrer" class="ext">we.hawtre.net ↗</a></nav>
</header>
<div class="wrap">
  <div class="sub" id="meta">Loading…</div>
  <div class="filters">
    <label>Host country (where the companies stand)<select id="f-host"></select></label>
    <label>Source country (whose companies)<select id="f-src"></select></label>
    <label>Month<input type="month" id="f-month"></label>
  </div>
  <div id="view"></div>
</div>
<script>
(function(){
"use strict";
var D=null,st={host:-1,src:-1,month:""};
var $=function(i){return document.getElementById(i)};
function el(tag,attrs,kids){var e=document.createElement(tag);if(attrs)for(var k in attrs){if(k==="text")e.textContent=attrs[k];else if(k==="class")e.className=attrs[k];else e.setAttribute(k,attrs[k])}(kids||[]).forEach(function(c){if(c!=null)e.appendChild(typeof c==="string"?document.createTextNode(c):c)});return e}
function num(n,d){var o=new String(n==null||isNaN(n)?"–":Number(n).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d}));o.raw=n==null||isNaN(n)?"":Math.round(n*1e4)/1e4;return o}
var m2=function(n){return num(n,2)},m4=function(n){return num(n,4)},m0=function(n){return num(n,0)};
var fmtD=function(s){return s?s.slice(0,16).replace("T"," "):"–"};
function nm(i){if(i<0||i==null)return"–";var e=D.ents[i];return e[2]||(e[1].slice(-6))}
function tbl(cols,rows){
  var t=el("table",{class:"stack"}),h=el("tr");cols.forEach(function(c){h.appendChild(el("th",{class:c[2]?"n":"",text:c[0]}))});t.appendChild(el("thead",null,[h]));
  var b=el("tbody");rows.forEach(function(r){var tr=el("tr");cols.forEach(function(c){var v=c[1](r),td=el("td",{class:c[2]?"n":"","data-label":c[0],text:String(v)});if(v&&v.raw!==undefined)td.setAttribute("data-raw",v.raw);tr.appendChild(td)});b.appendChild(tr)});t.appendChild(b);
  return weCsvWrap(el("div",{class:"tw"},[t]))}
function kpis(list){var k=el("div",{class:"kpis"});list.forEach(function(x){k.appendChild(el("div",{class:"kpi"},[el("b",{text:String(x[0])}),el("span",{text:x[1]}),x[2]?el("small",{text:x[2],style:"display:block;color:var(--muted);margin-top:2px"}):null]))});return k}
function card(title,kids){return el("div",{class:"card"},[el("h2",{text:title})].concat(kids||[]))}
function note(t){return el("div",{class:"note",text:t})}
function monthDays(m){var y=+m.slice(0,4),mo=+m.slice(5,7);return new Date(Date.UTC(y,mo,0)).getUTCDate()}
function monthName(m){return new Date(m+"-01T00:00:00Z").toLocaleString("en-GB",{month:"long",year:"numeric",timeZone:"UTC"})}
function nextMonthFirst(m){var y=+m.slice(0,4),mo=+m.slice(5,7);return new Date(Date.UTC(y,mo,1)).toISOString().slice(0,10)}

/* ---------- model ---------- */
function hostOf(c){var r=(D.regionsNow||{})[c[4]];return r?r[1]:-1}
function calc(){
  var R=D.regionsNow||{},regs={},comps=[];
  D.companies.forEach(function(c){if(c[5]!==st.src||hostOf(c)!==st.host)return;comps.push(c);
    var g=regs[c[4]]=regs[c[4]]||{id:c[4],name:R[c[4]][0],n:0,w:0,wages:0};g.n++;g.w+=c[6]||0;g.wages+=c[7]||0});
  var inc=0,man=0,wages=0,staff=0,list=Object.keys(regs).map(function(k){var g=regs[k],r=R[k],emp=r[2],mgr=r[3],nco=r[4],nem=r[5];
    g.emp=emp;g.mgr=mgr;g.nco=nco;g.nem=nem;
    g.si=nem?Math.min(1,g.w/nem):0;g.sm=nco?Math.min(1,g.n/nco):0;
    g.inc=emp*g.si;g.man=mgr*g.sm;g.f=(emp+mgr)>0?(g.inc+g.man)/(emp+mgr):0;
    inc+=g.inc;man+=g.man;wages+=g.wages;staff+=g.w;return g}).sort(function(a,b){return(b.inc+b.man)-(a.inc+a.man)});
  var TH=D.taxHist||{days:{}},fac={};list.forEach(function(g){fac[g.id]=g.f});
  var days={};Object.keys(TH.days||{}).forEach(function(d){var x=TH.days[d],o=0;for(var rid in x.r)if(fac[rid])o+=fac[rid]*x.r[rid];days[d]={day:d,h:x.h,owed:o,wages:wages*x.h}});
  var ct=(D.countryTax||{})[st.host]||[null,null];
  return{comps:comps,regs:list,inc:inc,man:man,hour:inc+man,wages:wages,staff:staff,days:days,rate:ct[0],mrate:ct[1],ncomp:comps.length}}

/* ---------- view ---------- */
function render(){
  var v=$("view");v.textContent="";
  if(st.host<0||st.src<0){v.appendChild(note("No collected companies yet. Company data is collected by the scheduled refresh; check back after the next run."));return}
  var M=calc(),hn=nm(st.host),sn=nm(st.src),today=new Date().toISOString().slice(0,10),mk=st.month;
  var dm=Object.keys(M.days).filter(function(d){return d.slice(0,7)===mk}).sort().map(function(d){return M.days[d]});
  var owedM=dm.reduce(function(s,x){return s+x.owed},0),hM=dm.reduce(function(s,x){return s+x.h},0),hAll=monthDays(mk)*24;
  var est=hM>0?owedM/hM*hAll:M.hour*hAll,tdy=M.days[today];
  v.appendChild(kpis([
    [m2(M.hour*24),"Tax owed a day",(tdy?m2(tdy.owed)+" so far today":"no tracking yet today")],
    [m2(M.hour),"Owed per hour, right now",""],
    [(M.rate==null?"–":M.rate+"%")+" · "+(M.mrate==null?"–":M.mrate+"%"),hn+"’s taxes","income · manager"],
    [m2(owedM),"Total owed, "+monthName(mk),"tracked "+num(hM,1)+" of "+m0(hAll)+" h"],
    [m2(est),"Estimated bill, full month",monthName(mk)]]));
  if(!M.ncomp){v.appendChild(card("Nothing to assess",[note("No collected "+sn+" companies stand in "+hn+". Pick another pair.")]));return}
  /* 1: per hour now */
  var c1=card("What "+hn+" owes on "+sn+" companies, per hour, right now",[tbl([["Tax",function(r){return r[0]}],["Region total /h",function(r){return m4(r[1])},1],["Share of region",function(r){return r[2]},1],["Owed /h",function(r){return m4(r[3])},1]],
    [["Income tax (employees)",M.regs.reduce(function(s,g){return s+g.emp},0),pct(M.regs,"si","emp"),M.inc],["Manager tax (owners)",M.regs.reduce(function(s,g){return s+g.mgr},0),pct(M.regs,"sm","mgr"),M.man]]),
    note("Total "+M.hour.toFixed(4)+" /h × 24 = "+(M.hour*24).toFixed(2)+" /day. Region totals are the game’s own hourly figures for every company in the region; the "+sn+" share is staff-based for income tax and company-count-based for manager tax. "+M.ncomp+" "+sn+" companies, "+M.staff+" staff, across "+M.regs.length+" regions of "+hn+".")]);
  v.appendChild(c1);
  /* 2: cross check */
  var est2=M.rate==null?null:M.wages*M.rate/100,c2=card("Cross-check from our own staff scan",[]);
  if(!M.staff&&!M.wages)c2.appendChild(note("Staff and wages have not been collected yet; they appear after the next daily company scan."));
  else{c2.appendChild(tbl([["Measure",function(r){return r[0]}],["Value",function(r){return r[1]},1]],[
    ["Companies scanned",m0(M.ncomp)],["Employees",m0(M.staff)],["Wages /h (before tax)",m4(M.wages)],["Income tax rate",String(M.rate==null?"–":M.rate+"%")],["Estimated income tax /h (wages × rate)",m4(est2)],["Game’s figure, income tax /h",m4(M.inc)],["Game’s figure as % of estimate",est2?m2(M.inc/est2*100):"–"]]));
    c2.appendChild(note("We bill the game’s figure above, not this estimate. A large gap means the staff scan misses companies or the region share is off. Manager pay is not collected, so manager tax has no cross-check."))}
  v.appendChild(c2);
  /* 3: day by day */
  var c3=card("Day by day, "+monthName(mk),[]);
  if(!dm.length)c3.appendChild(note("No tracked time in this month yet."));
  else{var cum=0,rows=dm.map(function(x){cum+=x.owed;return{day:x.day,h:x.h,w:x.wages,o:x.owed,c:cum}});
    c3.appendChild(tbl([["Day (UTC)",function(r){return r.day}],["Hours tracked",function(r){return m2(r.h)},1],[sn+" wages paid (est.)",function(r){return m2(r.w)},1],["Owed",function(r){return m2(r.o)},1],["Cumulative",function(r){return m2(r.c)},1]],rows));
    c3.appendChild(note("Each refresh records every region’s hourly tax; the rate at one check is held until the next (at most 6 h), days are UTC. Past days use today’s "+sn+" shares, so older figures are approximate. Wages paid = today’s wages/h × hours tracked."))}
  v.appendChild(c3);
  /* 4: month bill */
  var c4=card("This month’s bill: "+monthName(mk),[tbl([["Item",function(r){return r[0]}],["Amount",function(r){return r[1]},1]],[
    ["Tax owed so far (tracked)",m2(owedM)],["Hours tracked / in month",num(hM,1)+" / "+m0(hAll)],["Estimated for the full month",m2(est)],["Payment due",nextMonthFirst(mk)]]),
    note("The full-month estimate scales the tracked average to every hour of the month; with no tracking yet it uses the current hourly figure. Payments already made aren’t subtracted.")]);
  v.appendChild(c4);
  /* 5: regions + companies */
  v.appendChild(card("By region",[tbl([["Region",function(g){return g.name}],["Companies",function(g){return g.n+" / "+g.nco},1],["Staff",function(g){return g.w+" / "+g.nem},1],["Wages /h",function(g){return m4(g.wages)},1],["Owed /h",function(g){return m4(g.inc+g.man)},1],["Owed /day",function(g){return m2((g.inc+g.man)*24)},1]],M.regs)]));
  var lim=st.limit||100,cs=M.comps.slice().sort(function(a,b){return(b[7]||0)-(a[7]||0)});
  var c5=card(sn+" companies in "+hn,[tbl([["Company",function(c){return c[0]||""}],["Owner",function(c){return nm(c[1])}],["Makes",function(c){return c[2]||""}],["Region",function(c){return D.regionsNow[c[4]][0]}],["Staff",function(c){return m0(c[6]||0)},1],["Wages /h",function(c){return m4(c[7]||0)},1]],cs.slice(0,lim))]);
  if(cs.length>lim){var b=el("button",{class:"chip",text:"Show more ("+(cs.length-lim)+" left)"});b.onclick=function(){st.limit=lim+200;render()};c5.appendChild(b)}
  v.appendChild(c5)}
function pct(regs,k,t){var tot=regs.reduce(function(s,g){return s+g[t]},0),got=regs.reduce(function(s,g){return s+g[t]*g[k]},0);return tot?Math.round(got/tot*1000)/10+"%":"–"}

/* ---------- controls ---------- */
function fillSelects(){
  var R=D.regionsNow||{},hostN={},srcN={},pair={};
  D.companies.forEach(function(c){var h=hostOf(c);if(h<0||c[5]<0)return;hostN[h]=(hostN[h]||0)+1;srcN[c[5]]=(srcN[c[5]]||0)+1;var k=h+"|"+c[5];pair[k]=(pair[k]||0)+1});
  var best=Object.keys(pair).filter(function(k){return k.split("|")[0]!==k.split("|")[1]}).sort(function(a,b){return pair[b]-pair[a]})[0]||Object.keys(pair).sort(function(a,b){return pair[b]-pair[a]})[0];
  if(best){st.host=+best.split("|")[0];st.src=+best.split("|")[1]}
  function fill(id,cnt,cur){var s=$(id);s.textContent="";Object.keys(cnt).sort(function(a,b){return nm(+a).localeCompare(nm(+b))}).forEach(function(k){s.appendChild(el("option",{value:k,text:nm(+k)+" ("+cnt[k]+")"}))});s.value=String(cur)}
  fill("f-host",hostN,st.host);fill("f-src",srcN,st.src);
  $("f-host").onchange=function(){st.host=+this.value;st.limit=0;render()};
  $("f-src").onchange=function(){st.src=+this.value;st.limit=0;render()}}
function stale(){var a=(Date.now()-Date.parse(D.generated))/36e5;if(a>3)$("meta").insertAdjacentElement("afterend",el("div",{class:"hint",text:"Data is "+Math.round(a)+" h old: the hourly refresh may have failed or been skipped."}))}
fetch("data.json").then(function(r){return r.json()}).then(function(d){
  D=d;stale();D.companies=D.companies||[];
  var TH=D.taxHist,days=TH&&TH.days?Object.keys(TH.days).sort():[];
  st.month=(days.length?days[days.length-1]:new Date().toISOString().slice(0,10)).slice(0,7);
  $("f-month").value=st.month;$("f-month").onchange=function(){if(this.value){st.month=this.value;render()}};
  fillSelects();
  $("meta").textContent="Updated "+fmtD(D.generated)+" UTC"+(D.companiesAt?" · companies collected "+fmtD(D.companiesAt)+" UTC":"")+" · data from api2.warera.io";
  render();
}).catch(function(e){$("meta").textContent="Could not load data.json: "+e.message});
})();
</script>
</body>
</html>
