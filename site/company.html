<script>
(function(){
"use strict";
var D=null,st={host:-1,src:-1,month:""};
var $=function(i){return document.getElementById(i)};
function el(tag,attrs,kids){var e=document.createElement(tag);if(attrs)for(var k in attrs){if(k==="text")e.textContent=attrs[k];else if(k==="class")e.className=attrs[k];else e.setAttribute(k,attrs[k])}(kids||[]).forEach(function(c){if(c!=null)e.appendChild(typeof c==="string"?document.createTextNode(c):c)});return e}
function num(n,d){var o=new String(n==null||isNaN(n)?"–":Number(n).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d}));o.raw=n==null||isNaN(n)?"":Math.round(n*1e4)/1e4;return o}

var fmtD=function(s){return s?s.slice(0,16).replace("T"," "):"–"};
function nm(i){if(i<0||i==null)return"–";var e=D.ents[i];return e[2]||(e[1].slice(-6))}
function tbl(cols,rows){
  var t=el("table",{class:"stack"}),h=el("tr");cols.forEach(function(c){h.appendChild(el("th",{class:c[2]?"n":"",text:c[0]}))});t.appendChild(el("thead",null,[h]));
  var b=el("tbody");rows.forEach(function(r){var tr=el("tr");cols.forEach(function(c){var v=c[1](r),td=el("td",{class:c[2]?"n":"","data-label":c[0],text:String(v)});if(v&&v.raw!==undefined)td.setAttribute("data-raw",v.raw);tr.appendChild(td)});b.appendChild(tr)});t.appendChild(b);
  return weCsvWrap(el("div",{class:"tw"},[t]))}
function kpis(list){var k=el("div",{class:"kpis"});list.forEach(function(x){k.appendChild(el("div",{class:"kpi"},[el("b",{text:String(x[0])}),el("span",{text:x[1]}),x[2]?el("small",{text:x[2],style:"display:block;color:var(--muted);margin-top:2px"}):null]))});return k}
function card(title,kids){return el("div",{class:"card"},[el("h2",{text:title})].concat(kids||[]))}
function note(t){return el("div",{class:"note",text:t})}
function monthDays(m){var y=+m.slice(0,4),mo=+m.slice(5,7);return new Date(Date.UTC(y,mo,0)).getUTCDate()}
function monthName(m){return new Date(m+"-01T00:00:00Z").toLocaleString("en-GB",{month:"long",year:"numeric",timeZone:"UTC"})}
function nextMonthFirst(m){var y=+m.slice(0,4),mo=+m.slice(5,7);return new Date(Date.UTC(y,mo,1)).toISOString().slice(0,10)}

/* ---------- model ---------- */
var CAP=6*3600*1000;
function hostOf(c){var r=(D.regionsNow||{})[c[4]];return r?r[1]:-1}
function step(arr,t){var lo=0,hi=arr.length-1,k=-1;while(lo<=hi){var m=(lo+hi)>>1;if(arr[m][0]<=t){k=m;lo=m+1}else hi=m-1}return k<0?null:arr[k]}
function calc(){
  var R=D.regionsNow||{},regs={},comps=[];
  D.companies.forEach(function(c){if(c[5]!==st.src||hostOf(c)!==st.host)return;comps.push(c);
    var g=regs[c[4]]=regs[c[4]]||{id:c[4],name:R[c[4]][0],n:0,w:0,wages:0,mg:0};g.n++;g.w+=c[6]||0;g.wages+=c[7]||0;g.mg+=c[8]||0});
  var ct=(D.countryTax||{})[st.host]||[null,null],wages=0,mpay=0,staff=0,gInc=0,gMan=0,list=Object.keys(regs).map(function(k){var g=regs[k],r=R[k];
    g.emp=r[2];g.mgr=r[3];g.nco=r[4];g.nem=r[5];g.si=g.nem?Math.min(1,g.w/g.nem):0;g.sm=g.nco?Math.min(1,g.n/g.nco):0;
    g.gi=g.emp*g.si;g.gm=g.mgr*g.sm;g.ti=g.wages*(ct[0]||0)/100;g.tm=g.mg*(ct[1]||0)/100;g.o=g.ti+g.tm;
    wages+=g.wages;mpay+=g.mg;staff+=g.w;gInc+=g.gi;gMan+=g.gm;return g}).sort(function(a,b){return b.o-a.o});
  var empTax=wages*(ct[0]||0)/100,manTax=mpay*(ct[1]||0)/100;
  /* hourly history: wages x the host's income tax rate at that time, held from each check to the next (max 6 h) */
  var keys={};list.forEach(function(g){keys[g.id]=1});
  (D.wageHist||[]).forEach(function(r){if(r[1]===st.src&&R[r[0]]&&R[r[0]][1]===st.host)keys[r[0]]=1});
  var per={};(D.wageHist||[]).forEach(function(r){if(r[1]!==st.src||!keys[r[0]])return;(per[r[0]]=per[r[0]]||[]).push([r[2],r[3],r[4],r[5],r[6]||0])});
  var rates=(D.rateHist||{})[st.host]||[],runs=(D.runs||[]).slice(),now=Date.now();
  var ivs=[],days={};
  for(var i=0;i<runs.length;i++){
    var t0=runs[i],nx=i+1<runs.length?runs[i+1]:now,t1=Math.min(nx,t0+CAP);if(t1<=t0)continue;
    var n=0,w=0,wg=0,mg=0;Object.keys(per).forEach(function(k){var x=step(per[k],t0);if(x){n+=x[1];w+=x[2];wg+=x[3];mg+=x[4]}});
    var rt=step(rates,t0),rate=rt?rt[1]:ct[0],mr=rt?rt[2]:ct[1],hrs=(t1-t0)/36e5,tax=wg*(rate||0)/100,mt=mg*(mr||0)/100;
    ivs.push({t:t0,h:hrs,n:n,w:w,wages:wg,mg:mg,rate:rate,tax:tax,mt:mt});
    var a=t0;while(a<t1){var ds=a-a%864e5,b=Math.min(t1,ds+864e5),hh=(b-a)/36e5,key=new Date(ds).toISOString().slice(0,10),d=days[key]=days[key]||{day:key,h:0,n:0,w:0,paid:0,tax:0,mt:0};
      d.h+=hh;d.n+=n*hh;d.w+=w*hh;d.paid+=wg*hh;d.tax+=tax*hh;d.mt+=mt*hh;a=b}}
  Object.keys(days).forEach(function(k){var d=days[k];d.o=d.tax+d.mt;d.n=d.h?d.n/d.h:0;d.w=d.h?d.w/d.h:0});
  return{gMan:gMan,comps:comps,regs:list,wages:wages,staff:staff,ncomp:comps.length,rate:ct[0],mrate:ct[1],empTax:empTax,manTax:manTax,mpay:mpay,hour:empTax+manTax,gInc:gInc,days:days,ivs:ivs}}

function owedChart(dm,title){
  var card=card0(title),mx=Math.max.apply(null,dm.map(function(x){return x.o}).concat([0]))||1,ch=el("div",{class:"chart"});
  ["0","50%","calc(100% - 1px)"].forEach(function(t){var g=el("div",{class:"gl"});g.style.top=t;ch.appendChild(g)});
  dm.forEach(function(x){var c=el("div",{class:"col"});c.style.height=Math.max(2,100*x.o/mx)+"%";
    var msg=x.day+": "+m2(x.o)+" owed (employees "+m2(x.tax)+", managers "+m2(x.mt)+") · "+num(x.h,1)+" h tracked";
    c.setAttribute("title",msg);c.addEventListener("mousemove",function(e){var t=$("tip");t.textContent=msg;t.style.display="block";t.style.left=Math.min(e.clientX+12,innerWidth-260)+"px";t.style.top=(e.clientY+12)+"px"});
    c.addEventListener("mouseleave",function(){$("tip").style.display="none"});ch.appendChild(c)});
  card.appendChild(el("div",{class:"chartwrap"},[el("div",{class:"yax"},[el("span",{text:String(m2(mx))}),el("span",{text:String(m2(mx/2))}),el("span",{text:"0"})]),ch]));
  card.appendChild(el("div",{class:"axis"},[el("span",{text:dm[0].day}),el("span",{text:dm[dm.length-1].day})]));return card}
function card0(t){return el("div",{class:"card"},[el("h2",{text:t})])}
/* ---------- view ---------- */
function render(){
  var v=$("view");v.textContent="";
  if(st.host<0||st.src<0){v.appendChild(note("No collected companies yet. Company data is collected by the scheduled refresh; check back after the next run."));return}
  var M=calc(),hn=nm(st.host),sn=nm(st.src),today=new Date().toISOString().slice(0,10),mk=st.month;
  var dm=Object.keys(M.days).filter(function(d){return d.slice(0,7)===mk}).sort().map(function(d){return M.days[d]});
  var owedM=dm.reduce(function(s,x){return s+x.o},0),hM=dm.reduce(function(s,x){return s+x.h},0),hAll=monthDays(mk)*24;
  var est=hM>0?owedM/hM*hAll:M.hour*hAll,tdy=M.days[today];
  v.appendChild(kpis([
    [m2(M.hour*24),"Tax owed a day",(tdy?m2(tdy.o)+" so far today":"no tracking yet today")],
    [m2(M.hour),"Owed per hour, right now","employees "+m4(M.empTax)+" · managers "+m4(M.manTax)],
    [(M.rate==null?"–":M.rate+"%")+" · "+(M.mrate==null?"–":M.mrate+"%"),hn+"’s taxes","employee income · manager"],
    [m2(owedM),"Total owed, "+monthName(mk),"tracked "+num(hM,1)+" of "+m0(hAll)+" h"],
    [m2(est),"Estimated bill, full month",monthName(mk)]]));
  if(!M.ncomp){v.appendChild(card("Nothing to assess",[note("No active "+sn+" companies stand in "+hn+" right now. Pick another pair.")]));return}
  /* 1: per hour now */
  var c1=card("What "+hn+" collects on "+sn+" companies, per hour, right now",[tbl([["",function(r){return r[0]}],["Paid /h (before tax)",function(r){return r[1]},1],["Tax rate",function(r){return r[2]},1],["Tax /h",function(r){return r[3]},1]],
    [["Employees ("+M.staff+" workers)",m4(M.wages),String(M.rate==null?"–":M.rate+"%"),m4(M.empTax)],
     ["Managers ("+M.ncomp+" companies)",m4(M.mpay),String(M.mrate==null?"–":M.mrate+"%"),m4(M.manTax)],
     ["Total","","",m4(M.hour)]]),
    note(M.hour.toFixed(4)+" /h × 24 = "+(M.hour*24).toFixed(2)+" /day. "+M.ncomp+" active "+sn+" companies across "+M.regs.length+" region(s) of "+hn+". Employee tax = the wages those companies pay their employees each hour × "+hn+"’s income tax rate; manager tax = the managers’ hourly pay × "+hn+"’s manager tax rate"+(M.mrate===0?" (0%, so no manager tax is due)":"")+". Pay figures are the game’s live hourly wage and manager costs for each company (employee.getCompanyEstimate).")]);
  v.appendChild(c1);
  /* 2: cross check */
  var c2=card("Cross-check against the game’s own region figures",[]);
  if(!M.staff&&!M.wages)c2.appendChild(note("Staff and wages have not been collected yet; they appear after the next refresh."));
  else{var ratio=M.gInc?M.empTax/M.gInc*100:null;
    c2.appendChild(tbl([["Measure",function(r){return r[0]}],["Value",function(r){return r[1]},1]],[
    ["Employee tax /h, wages × rate (billed)",m4(M.empTax)],["Employee tax /h, game’s region figure × worker share",m4(M.gInc)],["Billed as % of the game’s figure",ratio==null?"–":m2(ratio)],["Manager tax /h, manager pay × rate (billed)",m4(M.manTax)],["Manager tax /h, game’s region figure × company share",m4(M.gMan)]]));
    c2.appendChild(note("The game’s figures are each region’s total employee and manager income tax, scaled by "+sn+"’s share of the region’s workers and companies. A large gap means the paid wages or the shares differ from what the game taxed."))}
  v.appendChild(c2);
  /* 3: hour by hour */
  var last=M.ivs.slice(-24).reverse(),c3=card("Hour by hour, latest checks",[]);
  if(!last.length)c3.appendChild(note("Hourly tracking starts with the next refresh."));
  else c3.appendChild(tbl([["Check (UTC)",function(x){return fmtD(new Date(x.t).toISOString())}],["Hours held",function(x){return m2(x.h)},1],["Companies",function(x){return m0(x.n)},1],["Employees",function(x){return m0(x.w)},1],["Wages /h",function(x){return m4(x.wages)},1],["Manager pay /h",function(x){return m4(x.mg)},1],["Rate %",function(x){return x.rate==null?"–":x.rate},1],["Employee tax",function(x){return m4(x.tax*x.h)},1],["Manager tax",function(x){return m4(x.mt*x.h)},1],["Owed",function(x){return m4((x.tax+x.mt)*x.h)},1]],last));
  v.appendChild(c3);
  if(dm.length)v.appendChild(owedChart(dm,"Tax owed per day, "+monthName(mk)));
  /* 4: day by day */
  var c4=card("Day by day, "+monthName(mk),[]);
  if(!dm.length)c4.appendChild(note("No tracked time in this month yet."));
  else{var cum=0,rows=dm.map(function(x){cum+=x.o;return{d:x,c:cum}});
    c4.appendChild(tbl([["Day (UTC)",function(r){return r.d.day}],["Hours tracked",function(r){return m2(r.d.h)},1],["Avg companies",function(r){return m1(r.d.n)},1],["Avg employees",function(r){return m1(r.d.w)},1],["Employee wages paid",function(r){return m2(r.d.paid)},1],["Employee tax",function(r){return m2(r.d.tax)},1],["Manager tax",function(r){return m2(r.d.mt)},1],["Owed",function(r){return m2(r.d.o)},1],["Cumulative",function(r){return m2(r.c)},1]],rows));
    c4.appendChild(note("Each refresh records the active companies, their workers and wages, and the host’s tax rate; the values at one check are held until the next (at most 6 h). Days are UTC. Company and worker counts change quickly, so each check uses what was found at that time."))}
  v.appendChild(c4);
  /* 5: month bill */
  v.appendChild(card("This month’s bill: "+monthName(mk),[tbl([["Item",function(r){return r[0]}],["Amount",function(r){return r[1]},1]],[
    ["Employee tax so far",m2(dm.reduce(function(s,x){return s+x.tax},0))],["Manager tax so far",m2(dm.reduce(function(s,x){return s+x.mt},0))],["Total owed so far (tracked)",m2(owedM)],["Hours tracked / in month",num(hM,1)+" / "+m0(hAll)],["Estimated for the full month",m2(est)],["Payment due",nextMonthFirst(mk)]]),
    note("The full-month estimate scales the tracked average to every hour of the month; with no tracking yet it uses the current hourly figure. Payments already made aren’t subtracted.")]));
  /* 6: regions + companies */
  v.appendChild(card("By region (now)",[tbl([["Region",function(g){return g.name}],["Companies",function(g){return g.n+" / "+g.nco},1],["Workers",function(g){return g.w+" / "+g.nem},1],["Wages /h",function(g){return m4(g.wages)},1],["Manager /h",function(g){return m4(g.mg)},1],["Owed /h",function(g){return m4(g.o)},1],["Owed /day",function(g){return m2(g.o*24)},1]],M.regs)]));
  var lim=st.limit||100,cs=M.comps.slice().sort(function(a,b){return(b[7]||0)-(a[7]||0)});
  var c5=card("Active "+sn+" companies in "+hn,[tbl([["Company",function(c){return c[0]||""}],["Owner",function(c){return nm(c[1])}],["Makes",function(c){return c[2]||""}],["Region",function(c){return D.regionsNow[c[4]][0]}],["Employees",function(c){return m0(c[6]||0)},1],["Wages /h",function(c){return m4(c[7]||0)},1],["Manager /h",function(c){return m4(c[8]||0)},1]],cs.slice(0,lim))]);
  if(cs.length>lim){var b=el("button",{class:"chip",text:"Show more ("+(cs.length-lim)+" left)"});b.onclick=function(){st.limit=lim+200;render()};c5.appendChild(b)}
  v.appendChild(c5)}

/* ---------- controls ---------- */
function fillSelects(){
  var R=D.regionsNow||{},hostN={},srcN={},pair={};
  D.companies.forEach(function(c){var h=hostOf(c);if(h<0||c[5]<0)return;hostN[h]=(hostN[h]||0)+1;srcN[c[5]]=(srcN[c[5]]||0)+1;var k=h+"|"+c[5];pair[k]=(pair[k]||0)+1});
  var best=Object.keys(pair).filter(function(k){return k.split("|")[0]!==k.split("|")[1]}).sort(function(a,b){return pair[b]-pair[a]})[0]||Object.keys(pair).sort(function(a,b){return pair[b]-pair[a]})[0];
  if(best){st.host=+best.split("|")[0];st.src=+best.split("|")[1]}
  function fill(id,cnt,cur){var s=$(id);s.textContent="";Object.keys(cnt).sort(function(a,b){return nm(+a).localeCompare(nm(+b))}).forEach(function(k){s.appendChild(el("option",{value:k,text:nm(+k)+" ("+cnt[k]+")"}))});s.value=String(cur)}
  fill("f-host",hostN,st.host);fill("f-src",srcN,st.src);
  $("f-host").onchange=function(){st.host=+this.value;st.limit=0;render()};
  $("f-src").onchange=function(){st.src=+this.value;st.limit=0;render()}}
function stale(){window.weStale(D.generated)}
fetch("data.json").then(function(r){return r.json()}).then(function(d){
  D=d;stale();D.companies=D.companies||[];
  var TH=D.taxHist,days=TH&&TH.days?Object.keys(TH.days).sort():[];
  st.month=(days.length?days[days.length-1]:new Date().toISOString().slice(0,10)).slice(0,7);
  $("f-month").value=st.month;$("f-month").onchange=function(){if(this.value){st.month=this.value;render()}};
  fillSelects();
  $("meta").textContent="Updated "+fmtD(D.generated)+" UTC"+(D.companiesAt?" · companies collected "+fmtD(D.companiesAt)+" UTC":"")+" · data from api2.warera.io";
  render();
}).catch(function(e){$("meta").textContent="Could not load data.json: "+e.message});
})();
</script>
