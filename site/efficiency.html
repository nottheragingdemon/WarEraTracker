<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player efficiency</title>
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
</head>
<body>
<header>
  <div class="header-top">
    <a class="brand" href="index.html"><h1>⚖️ Player efficiency</h1><div class="tag">Wealth against damage, and how each player spends skill points</div></a>
    <div class="header-actions">
      <div id="view-switch" class="theme-switch view-switch" role="group" aria-label="Table layout"><button type="button" data-view="cards" aria-pressed="true">Cards</button><button type="button" data-view="table" aria-pressed="false">Table</button></div>
      <div id="theme-switch" class="theme-switch" role="group" aria-label="Colour theme">
        <button type="button" data-theme-pref="auto" aria-pressed="true" title="Follow your device's light or dark setting">Auto</button>
        <button type="button" data-theme-pref="light" aria-pressed="false" aria-label="Light" title="Light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        <button type="button" data-theme-pref="dark" aria-pressed="false" aria-label="Dark" title="Dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
      </div>
    </div>
  </div>
  <nav class="apps" id="apps"><a href="index.html">WarEra Tracker</a><a href="company.html">Company tax tracker</a><a href="transfers.html">EA Money Transfers</a><a href="efficiency.html" aria-current="page">Player efficiency</a><a href="ask.html">Ask WarEra</a><a href="https://we.hawtre.net/" target="_blank" rel="noopener noreferrer" class="ext">we.hawtre.net ↗</a></nav>
</header>
<div class="wrap">
  <div class="sub" id="meta">Loading…</div>
  <div class="filters">
    <label>Nation<select id="f-nation"><option value="-1">All Emerald Accord nations</option></select></label>
    <label>Player<input id="f-name" placeholder="any (type a name)" autocomplete="off"></label>
  </div>
  <div id="view"></div>
</div>
<script>
(function(){
"use strict";
var D=null,st={nation:-1,metric:null,build:"all",name:"",open:{}};
var WAR=0.20,ECO=0.50,MIN=1e6,TOP=20;   // build thresholds (share of skill points in the four economy skills) and the damage floor
var $=function(i){return document.getElementById(i)};
function el(tag,attrs,kids){var e=document.createElement(tag);if(attrs)for(var k in attrs){if(k==="text")e.textContent=attrs[k];else if(k==="class")e.className=attrs[k];else e.setAttribute(k,attrs[k])}(kids||[]).forEach(function(c){if(c)e.appendChild(c)});return e}
function nm(i){if(i<0||i==null)return"–";var e=D.ents[i];return e[2]||("…"+e[1].slice(-6))}
function big(n){if(n==null||isNaN(n))return"–";var a=Math.abs(n);return a>=1e9?(n/1e9).toFixed(2)+"B":a>=1e6?(n/1e6).toFixed(2)+"M":a>=1e4?(n/1e3).toFixed(1)+"k":Math.round(n).toLocaleString()}
function sgn(n){return n==null?"–":(n>0?"+":"")+big(n)}
function raw(s,v){var o=new String(s);o.raw=v==null||isNaN(v)?"":Math.round(v*100)/100;return o}
var SK=null;
function build(p){if(!p.spent)return null;var r=p.eco/p.spent;return{share:r,kind:r<=WAR?"War":r>ECO?"Eco":"Hybrid"}}
function rows(){
  return D.players.map(function(r){var p={u:r[0],c:r[1],mu:r[2],wealth:r[3],dTot:r[4],dWeek:r[5],day:r[6],wThen:r[7],dThen:r[8],spent:r[9],eco:r[10],lv:r[11]};
    p.hist=!!p.day;p.dmg=p.hist?Math.max(0,p.dTot-p.dThen):p.dWeek;p.gain=p.hist?p.wealth-p.wThen:null;p.b=build(p);
    p.perGain=p.gain!=null&&p.dmg>0?p.gain/(p.dmg/1e6):null;p.perWealth=p.dmg>0?p.wealth/(p.dmg/1e6):null;return p})}
function card(t,kids){return el("div",{class:"card"},[el("h2",{text:t})].concat(kids||[]))}
function kpis(list){return el("div",{class:"kpis"},list.map(function(x){return el("div",{class:"kpi"},[el("b",{text:String(x[0])}),el("span",{text:x[1]})])}))}
function chips(opts,key){var seg=el("div",{class:"seg"});opts.forEach(function(o){var b=el("button",{class:"chip",text:o[1],"aria-pressed":String(st[key]===o[0])});b.onclick=function(){st[key]=o[0];render()};seg.appendChild(b)});return seg}
function badge(b){if(!b)return el("span",{class:"muted",text:"–"});return el("span",{class:"build b-"+b.kind.toLowerCase(),text:b.kind+" · "+Math.round(100*b.share)+"% eco",title:"Share of skill points in companies, energy, management and production"})}
function skillLine(p){if(!p.lv)return"Skills not loaded yet.";return SK.map(function(k,i){return k+" "+p.lv[i]}).filter(function(x){return !/ 0$/.test(x)}).join(" · ")+" ("+p.spent+" points, "+p.eco+" in economy skills)"}
function table(list,metric){
  var t=el("table",{class:"stack"}),cols=["#","Player","Build","Wealth","Wealth change","Damage (7 days)",metric==="gain"?"Wealth gained per 1M damage":"Wealth per 1M damage"];
  var h=el("tr");cols.forEach(function(c,i){h.appendChild(el("th",{class:i>=3||i===0?"n":"",text:c}))});t.appendChild(el("thead",null,[h]));
  var tb=el("tbody");
  list.forEach(function(p,i){var v=metric==="gain"?p.perGain:p.perWealth;
    var cells=[raw(String(i+1),i+1),nm(p.u),null,raw(big(p.wealth),p.wealth),raw(sgn(p.gain),p.gain),raw(big(p.dmg),p.dmg),raw(v==null?"–":big(v),v)];
    var tr=el("tr",{class:st.open[p.u]?"sel":""});tr.style.cursor="pointer";
    cells.forEach(function(c,j){var td=el("td",{class:j>=3||j===0?"n":"","data-label":cols[j]});if(j===2)td.appendChild(badge(p.b));else{td.textContent=String(c);if(c&&c.raw!==undefined)td.setAttribute("data-raw",c.raw)}tr.appendChild(td)});
    tr.onclick=function(){st.open[p.u]=!st.open[p.u];render()};tb.appendChild(tr);
    if(st.open[p.u]){var d=el("tr",{class:"detail"});var td=el("td",{colspan:String(cols.length),"data-label":""});
      td.appendChild(el("div",{class:"note",text:"Military unit: "+nm(p.mu)+" · "+skillLine(p)+(p.hist?" · compared with "+p.day:" · no earlier snapshot yet")}));d.appendChild(td);tb.appendChild(d)}});
  t.appendChild(tb);return weCsvWrap(el("div",{class:"tw"},[t]))}
function render(){
  var all=rows(),hist=all.some(function(p){return p.hist});if(!st.metric)st.metric=hist?"gain":"wealth";var metric=st.metric,v=$("view");v.textContent="";
  var q=st.name.trim().toLowerCase();
  var pool=all.filter(function(p){return(st.nation<0||p.c===st.nation)&&(st.build==="all"||(p.b&&p.b.kind===st.build))&&(!q||nm(p.u).toLowerCase().indexOf(q)>=0)});
  var qual=pool.filter(function(p){return p.dmg>=MIN});
  var mix={War:0,Hybrid:0,Eco:0};qual.forEach(function(p){if(p.b)mix[p.b.kind]++});
  v.appendChild(kpis([[qual.length,"Players with 1M+ damage"],[mix.War,"War builds"],[mix.Hybrid,"Hybrid builds"],[mix.Eco,"Eco builds"]]));
  var ctl=card("How players are ranked",[chips([["gain","Wealth gained per 1M damage"],["wealth","Wealth per 1M damage"]],"metric"),chips([["all","All builds"],["War","War"],["Hybrid","Hybrid"],["Eco","Eco"]],"build"),
    el("div",{class:"note",text:"Each nation lists its top "+TOP+" players with at least 1M damage over the last 7 days, ranked by "+(metric==="gain"?"how much wealth they gained for every 1M damage dealt":"their wealth for every 1M damage dealt")+". Build: War = "+Math.round(WAR*100)+"% or less of skill points in companies, energy, management and production; Eco = more than "+Math.round(ECO*100)+"%; Hybrid in between. Tap a player for their skills."}),
    hist?null:el("div",{class:"note",text:"Weekly wealth change needs a snapshot from an earlier day: the first one was taken today, so changes appear from tomorrow and cover a full week after 7 days. Until then, damage is the game's weekly ranking (since its weekly reset)."})]);
  v.appendChild(ctl);
  var by={};qual.forEach(function(p){(by[p.c]=by[p.c]||[]).push(p)});
  var key=function(p){var x=metric==="gain"?p.perGain:p.perWealth;return x==null?-Infinity:x};
  var nations=Object.keys(by).map(Number).sort(function(a,b){return by[b].length-by[a].length||nm(a).localeCompare(nm(b))});
  if(!nations.length){v.appendChild(card("No players",[el("div",{class:"note",text:"No tracked player matches these filters with 1M+ damage in the last 7 days."})]));return}
  nations.forEach(function(c){var l=by[c].sort(function(a,b){return key(b)-key(a)}).slice(0,TOP);
    var m={War:0,Hybrid:0,Eco:0};by[c].forEach(function(p){if(p.b)m[p.b.kind]++});
    v.appendChild(card(nm(c)+" · top "+l.length+" of "+by[c].length,[el("div",{class:"note",text:"Builds among its 1M+ damage players: War "+m.War+" · Hybrid "+m.Hybrid+" · Eco "+m.Eco}),table(l,metric)]))})}
function stale(){window.weStale(D.generated)}
fetch("data.json").then(function(r){return r.json()}).then(function(d){
  D=d;D.players=D.players||[];SK=D.skillOrder||[];stale();
  var cs={};D.players.forEach(function(p){cs[p[1]]=1});
  Object.keys(cs).map(Number).sort(function(a,b){return nm(a).localeCompare(nm(b))}).forEach(function(c){$("f-nation").appendChild(el("option",{value:String(c),text:nm(c)}))});
  $("f-nation").onchange=function(){st.nation=+this.value;render()};
  $("f-name").oninput=function(){st.name=this.value;render()};
  $("meta").textContent="Updated "+(D.generated||"").slice(0,16).replace("T"," ")+" UTC · "+D.players.length+" players tracked in Emerald Accord nations · data from api2.warera.io";
  render();
}).catch(function(e){$("meta").textContent="Could not load data.json: "+e.message});
})();
</script>
<footer class="site-foot">Supported by <a href="https://warerastats.io" target="_blank" rel="noopener noreferrer">warerastats.io</a></footer>
</body>
</html>
