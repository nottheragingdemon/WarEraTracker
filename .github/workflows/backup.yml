name: Weekly backup

# Sundays 03:07 UTC: copies the history database (the state branch) to backup/state-YYYY-MM-DD and keeps the newest 4.
# If the state branch is ever lost or damaged, the next run restores from the newest backup automatically.
on:
  schedule:
    - cron: "7 3 * * 0"
  workflow_dispatch:

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Back up the state branch
        run: sh state.sh backup
      - name: Failure alert
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          python3 -m wartrack alerts --failure "WarEra Tracker: the $WORKFLOW run failed. $RUN_URL"
