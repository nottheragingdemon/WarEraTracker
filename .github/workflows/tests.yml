name: Tests

on:
  push:
    paths: ["tests/**", "scripts/**", "site/*.html", "site/*.js", "site/*.css", "streamlit_app.py", ".github/workflows/tests.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "streamlit>=1.61.1"
      - name: Unit tests (pages, Streamlit app, artifact copies)
        run: python -m unittest discover -s tests -v
      - name: The battle check script compiles
        run: python -m py_compile scripts/battlecheck.py
      - name: Every page loads its data without JavaScript errors (headless Chrome)
        run: python scripts/smoke_pages.py
      - name: The same pages as the Streamlit app serves them (data inlined), with real numbers on screen
        run: python scripts/smoke_pages.py --streamlit
      - name: Accessibility (contrast, names for buttons, links and fields) in the light and dark theme
        run: |
          npm install --prefix /tmp/axe axe-core --silent
          AXE=/tmp/axe/node_modules/axe-core/axe.min.js python scripts/a11y_pages.py
