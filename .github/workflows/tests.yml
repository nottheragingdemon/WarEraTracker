name: Tests

on:
  push:
    paths: ["wartrack/**", "tests/**", "scripts/**", "site/*.html", "site/*.js", "site/*.css", "streamlit_app.py", ".github/workflows/tests.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install aiohttp
      - name: Unit tests (aiohttp transport)
        run: python -m unittest discover -s tests -v
      - name: The command line starts
        run: python -m wartrack --help
      - name: Every page loads its data without JavaScript errors (headless Chrome)
        run: python scripts/smoke_pages.py
