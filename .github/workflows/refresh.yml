name: Refresh data

on:
  schedule:
    - cron: "17 * * * *"   # hourly; GitHub may start runs late or skip one
  workflow_dispatch:
    inputs:
      gateway:
        description: "Use the warerastats gateway (off = official API only)"
        type: boolean
        default: true

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install aiohttp
      - name: Restore history from the state branch
        run: sh state.sh restore
      - name: Collect and export
        env:
          WARERA_API_KEY: ${{ secrets.WARERA_API_KEY }}
          WARERA_GATEWAY: ${{ (github.event_name == 'workflow_dispatch' && !inputs.gateway) && '0' || vars.WARERA_GATEWAY || '1' }}
        run: sh refresh.sh
      - name: Alerts (only if ALERT_WEBHOOK_URL is set)
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python3 -m wartrack alerts
      - name: Save history to the state branch
        run: |
          git config user.name "warera-tracker"; git config user.email "warera-tracker@users.noreply.github.com"
          sh state.sh save
      - name: Commit data.json (Streamlit redeploys on push)
        run: |
          git add site/data.json site/ask-data.json
          git diff --cached --quiet || {
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do
              git pull --rebase -q origin main && git push && break
              sleep 5
            done
          }
      - name: Failure alert
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          python3 -m wartrack alerts --failure "WarEra Tracker: the $WORKFLOW run failed. $RUN_URL"
