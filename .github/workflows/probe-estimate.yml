name: probe-estimate
# One-off, manual: official API only (the key goes to api2.warera.io).
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare estimates with listed wages
        env:
          WARERA_API_KEY: ${{ secrets.WARERA_API_KEY }}
        run: python3 scripts/probe_estimate.py
