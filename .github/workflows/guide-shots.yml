name: Guide screenshots

# Weekly: retake the phone screenshots in the Guide from the current pages and commit them when they changed.
on:
  schedule:
    - cron: "11 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python3 scripts/guide_shots.py "$(command -v google-chrome || command -v chromium)"
      - name: Commit when changed
        run: |
          git diff --quiet site/guide.html && { echo "no change"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/guide.html
          git commit -m "Guide: refreshed screenshots"
          git pull -q --rebase
          git push
