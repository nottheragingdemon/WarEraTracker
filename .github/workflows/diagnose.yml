name: Diagnose employees

# Manual, read-only: compares the employee lists with the game's region counts for a few regions. Saves nothing.
on:
  workflow_dispatch:
    inputs:
      regions:
        description: "Region names, separated by |"
        default: "New England|Virginia|Northern Ireland|Zacatecas & San Luis Potosi"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-collector.txt
      - name: Restore history from the state branch
        run: sh state.sh restore
      - name: Diagnose
        env:
          WARERA_API_KEY: ${{ secrets.WARERA_API_KEY }}
          REGIONS: ${{ inputs.regions }}
        run: |
          IFS='|'; set -- $REGIONS; WARTRACK_DB=wartrack.sqlite python3 scripts/diag_employees.py "$@"
