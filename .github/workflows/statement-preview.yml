name: Statement preview

# Manual: posts this month's company tax statement so far to the alert webhook (Discord), to check the format before the
# final one goes out on the 1st. Changes nothing.
on:
  workflow_dispatch:
    inputs:
      country:
        description: "Host country"
        default: "Ireland"

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-collector.txt
      - name: Restore history from the state branch
        run: sh state.sh restore
      - name: Post the statement preview
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          COUNTRY: ${{ inputs.country }}
        run: WARTRACK_DB=wartrack.sqlite python3 -m wartrack alerts --statement-preview "$COUNTRY"
