name: Tax sample

# Records region tax rates every 15 minutes (one public API call) so tax history is finer than the hourly refresh.
on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub may start runs late or skip one
  workflow_dispatch:

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore history from the state branch
        run: sh state.sh restore
      - name: Record region tax rates
        run: WARTRACK_DB=wartrack.sqlite python3 -m wartrack collect --what regions
      - name: Save history to the state branch
        run: |
          git config user.name "warera-tracker"; git config user.email "warera-tracker@users.noreply.github.com"
          sh state.sh save
