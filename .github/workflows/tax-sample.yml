name: Quick sample

# Every 15 minutes: records region tax rates and checks for new battles, then sends battle alerts (the hourly refresh can start late or be skipped).
on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub may start runs late or skip one
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test message to the alert webhook"
        type: boolean
        default: false
      test_failure:
        description: "Make this run fail on purpose, to check that the failure alert is sent"
        type: boolean
        default: false

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-collector.txt
      - name: Simulated failure (test)
        if: ${{ inputs.test_failure }}
        run: |
          echo "Failing on purpose to test the failure alert"
          exit 1
      - name: Test alert
        if: ${{ inputs.test_alert }}
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python3 -m wartrack alerts --test
      - name: Restore history from the state branch
        run: sh state.sh restore
      - name: Record tax rates and new battles
        env:
          WARERA_API_KEY: ${{ secrets.WARERA_API_KEY }}
          WARERA_GATEWAY: ${{ vars.WARERA_GATEWAY || '0' }}
        run: WARTRACK_DB=wartrack.sqlite python3 -m wartrack collect --what regions,alliances,battles
      - name: Battle alerts
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_TRANSFER_MIN: ${{ vars.ALERT_TRANSFER_MIN }}
          ALERT_DONATION_DAY_MIN: ${{ vars.ALERT_DONATION_DAY_MIN }}
          ALERT_TREASURY_DROP_MIN: ${{ vars.ALERT_TREASURY_DROP_MIN }}
        run: python3 -m wartrack alerts
      - name: Save history to the state branch
        run: |
          git config user.name "warera-tracker"; git config user.email "warera-tracker@users.noreply.github.com"
          sh state.sh save
      - name: Failure alert
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          python3 -m wartrack alerts --failure "WarEra Ireland tools: the $WORKFLOW run failed. $RUN_URL"
