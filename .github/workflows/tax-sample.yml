name: Quick sample

# Every 15 minutes: records region tax rates and checks for new battles, then sends battle alerts (the hourly refresh can start late or be skipped).
on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub may start runs late or skip one
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test message to the alert webhook"
        type: boolean
        default: false

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install aiohttp
      - name: Test alert
        if: ${{ inputs.test_alert }}
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python3 -m wartrack alerts --test
      - name: Restore history from the state branch
        run: sh state.sh restore
      - name: Record tax rates and new battles
        env:
          WARERA_API_KEY: ${{ secrets.WARERA_API_KEY }}
        run: WARTRACK_DB=wartrack.sqlite python3 -m wartrack collect --what regions,alliances,battles
      - name: Battle alerts
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python3 -m wartrack alerts
      - name: Save history to the state branch
        run: |
          git config user.name "warera-tracker"; git config user.email "warera-tracker@users.noreply.github.com"
          sh state.sh save
      - name: Failure alert
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python3 -m wartrack alerts --failure "WarEra Tracker: the '${{ github.workflow }}' run failed. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
