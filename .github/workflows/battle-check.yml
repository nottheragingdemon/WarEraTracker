name: Battle check

# Every 15 minutes: posts new and ended battles involving the alliance to the alert webhook (Discord). Which battles were
# already announced is kept in state.json on the battlecheck-state branch. Everything else (the hourly collector, tax data,
# history) runs in the private back-end repo, which publishes site/*.json here every hour.
on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub may start runs late or skip one
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test message to the alert webhook"
        type: boolean
        default: false
      test_failure:
        description: "Make this run fail on purpose, to check that the failure alert is sent"
        type: boolean
        default: false

concurrency:
  group: battlecheck
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Simulated failure (test)
        if: ${{ inputs.test_failure }}
        run: |
          echo "Failing on purpose to test the failure alert"
          exit 1
      - name: Test alert
        if: ${{ inputs.test_alert }}
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python3 scripts/battlecheck.py state.json --test
      - name: Restore what was already announced
        run: |
          if git fetch -q --depth=1 origin battlecheck-state 2>/dev/null; then git show FETCH_HEAD:state.json > state.json; else echo '{}' > state.json; fi
          cat state.json
      - name: Check battles and post alerts
        env:
          WARERA_API_KEY: ${{ secrets.WARERA_API_KEY }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python3 scripts/battlecheck.py state.json
      - name: Save what was announced
        run: |
          git config user.name "warera-tracker"; git config user.email "warera-tracker@users.noreply.github.com"
          BLOB=$(git hash-object -w state.json)
          TREE=$(printf '100644 blob %s\tstate.json\n' "$BLOB" | git mktree)
          COMMIT=$(git commit-tree "$TREE" -m "battle check $(date -u +%FT%TZ)")
          git push -q --force origin "$COMMIT:refs/heads/battlecheck-state"
      - name: Failure alert
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          python3 scripts/battlecheck.py --failure "WarEra Ireland tools: the $WORKFLOW run failed. $RUN_URL"
