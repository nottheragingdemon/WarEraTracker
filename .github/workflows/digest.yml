name: Weekly digest

# Mondays 08:23 UTC: posts a summary of the week (damage, bounty per 1M, transfers, donations) to the alert webhook.
on:
  schedule:
    - cron: "23 8 * * 1"   # GitHub may start runs late
  workflow_dispatch:
    inputs:
      force:
        description: "Send even if a digest went out in the last 6 days"
        type: boolean
        default: false

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Restore history from the state branch
        run: sh state.sh restore
      - name: Send the weekly digest
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: WARTRACK_DB=wartrack.sqlite python3 -m wartrack alerts --digest $FORCE
      - name: Save history to the state branch
        run: |
          git config user.name "warera-tracker"; git config user.email "warera-tracker@users.noreply.github.com"
          sh state.sh save
      - name: Failure alert
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          python3 -m wartrack alerts --failure "WarEra Ireland tools: the $WORKFLOW run failed. $RUN_URL"
